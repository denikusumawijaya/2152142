<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nilai Tempat Desimal — Math Tutoring by Deni</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --green:#58cc02;--green-d:#46a302;--blue:#1cb0f6;--blue-d:#1899d6;
  --red:#ff4b4b;--yellow:#ffc800;--purple:#ce82ff;
  --gray:#afafaf;--gray-l:#e5e5e5;--gray-bg:#f7f7f7;
  --text:#4b4b4b;--text-l:#777;--white:#fff;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;color:var(--text);background:var(--gray-bg);line-height:1.6}

/* ===== TOP HEADER ===== */
.top-header{background:var(--white);padding:14px 24px;border-bottom:3px solid var(--gray-l);position:sticky;top:0;z-index:200;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.top-header h1{font-size:1.25rem;color:var(--green);font-weight:900}
.top-header .subtitle{font-size:.82rem;color:var(--text-l);font-weight:600}
.header-left{display:flex;align-items:center;gap:14px}
.header-logo{width:42px;height:42px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:900}

/* ===== BUTTONS ===== */
.btn{font-family:inherit;font-weight:800;border:none;border-radius:12px;padding:12px 20px;cursor:pointer;text-transform:uppercase;letter-spacing:.5px;font-size:.85rem;transition:all .1s;box-shadow:0 4px 0 rgba(0,0,0,.1)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.1)}
.btn-green{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d)}
.btn-blue{background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue-d)}
.btn-yellow{background:var(--yellow);color:#fff;box-shadow:0 4px 0 #cca300}
.btn-outline{background:#fff;color:var(--blue);border:2px solid var(--gray-l);box-shadow:0 4px 0 var(--gray-l)}
.btn-outline:active{box-shadow:0 2px 0 var(--gray-l)}
.btn:disabled{background:var(--gray-l);color:var(--gray);box-shadow:none;cursor:not-allowed;transform:none}

/* ===== STUDENT INFO BAR ===== */
.student-info{background:var(--white);padding:14px 24px;border-bottom:2px solid var(--gray-l);display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.info-field{display:flex;flex-direction:column;gap:3px}
.info-field label{font-size:.68rem;font-weight:800;color:var(--text-l);text-transform:uppercase;letter-spacing:.5px}
.info-field input{font-family:inherit;padding:7px 11px;border:2px solid var(--gray-l);border-radius:8px;font-size:.9rem;font-weight:600;color:var(--text)}
.info-field input:focus{outline:none;border-color:var(--blue)}
.score-badge{background:linear-gradient(135deg,#fff8e1,#ffe082);border:2px solid #ffc107;border-radius:10px;padding:7px 11px;text-align:center}
.score-badge .label{font-size:.68rem;font-weight:800;color:#996f00;text-transform:uppercase}
.score-badge .value{font-size:1.1rem;font-weight:900;color:#7a5400}

/* ===== MAP PATH ===== */
.map-path{background:linear-gradient(180deg,#e5f6ff 0%,#f7f7f7 100%);padding:36px 16px 24px;display:flex;justify-content:center;overflow-x:auto}
.map-track{display:flex;flex-direction:column;align-items:center;gap:0;position:relative;min-width:120px}
.map-node{width:76px;height:76px;border-radius:50%;background:var(--white);border:4px solid var(--gray-l);display:flex;align-items:center;justify-content:center;font-size:1.6rem;cursor:pointer;position:relative;transition:all .2s;z-index:2;box-shadow:0 4px 0 var(--gray-l)}
.map-node:hover{transform:scale(1.08)}
.map-node.active{border-color:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.map-node.completed{background:var(--green);border-color:var(--green-d);box-shadow:0 4px 0 var(--green-d)}
.map-connector{width:4px;height:32px;background:var(--gray-l);z-index:1}
.map-connector.completed{background:var(--green)}
.map-label{position:absolute;top:82px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:.72rem;font-weight:800;color:var(--text);text-align:center;background:var(--white);padding:5px 11px;border-radius:8px;border:2px solid var(--gray-l);line-height:1.3}
.map-label .dur{display:block;font-size:.62rem;color:var(--text-l);font-weight:700}

/* ===== MAIN LAYOUT ===== */
.main-container{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{background:var(--white);border-right:2px solid var(--gray-l);padding:20px 14px;position:sticky;top:71px;height:calc(100vh - 71px);overflow-y:auto}
.sidebar h3{font-size:.68rem;text-transform:uppercase;letter-spacing:1px;color:var(--text-l);margin-bottom:14px;font-weight:900;padding:0 8px}
.sidebar-nav{list-style:none;display:flex;flex-direction:column;gap:4px}
.sidebar-nav a{display:block;padding:9px 12px;border-radius:10px;text-decoration:none;color:var(--text);font-weight:700;font-size:.84rem;border:2px solid transparent;transition:all .1s;line-height:1.3}
.sidebar-nav a:hover{background:var(--gray-bg)}
.sidebar-nav a.active{background:#e5f6ff;border-color:var(--blue);color:var(--blue-d)}
.sidebar-nav a .dur{display:block;font-size:.66rem;color:var(--text-l);font-weight:600;margin-top:2px}
.sidebar-nav a.assignment-link{border-left:4px solid var(--purple);padding-left:10px}
.content-area{padding:28px 32px 60px;max-width:920px;margin:0 auto;width:100%}

/* ===== SECTION & SLIDES ===== */
.section{margin-bottom:40px;background:var(--white);border-radius:var(--r);padding:28px;box-shadow:0 2px 10px rgba(0,0,0,.04);scroll-margin-top:90px}
.section-header{display:flex;align-items:center;gap:14px;margin-bottom:20px;padding-bottom:16px;border-bottom:2px solid var(--gray-l)}
.section-icon{width:52px;height:52px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0}
.section-title{flex:1}
.section-title h2{font-size:1.3rem;color:var(--text);font-weight:900}
.section-duration{display:inline-block;background:var(--gray-bg);padding:3px 10px;border-radius:8px;font-size:.7rem;font-weight:800;color:var(--text-l);margin-top:4px}

.progress-bar{height:10px;background:var(--gray-l);border-radius:5px;margin-bottom:24px;overflow:hidden}
.progress-fill{height:100%;background:var(--green);width:0%;transition:width .4s ease;border-radius:5px}

.slide-wrapper{position:relative;min-height:350px}
.slide{display:none;animation:fadeIn .4s ease}
.slide.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ===== THEORY ===== */
.theory{background:linear-gradient(135deg,#fffbe6,#fff9db);border:2px solid #ffe066;border-left:6px solid var(--yellow);border-radius:12px;padding:18px 22px;margin:0 0 20px 0}
.theory h3{color:#a07200;font-size:1.05rem;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.theory p{margin-bottom:8px;line-height:1.7}
.theory .example{background:#fff;border-radius:8px;padding:12px 16px;margin:10px 0;border-left:4px solid var(--blue)}
.theory .example-label{font-size:.68rem;font-weight:900;text-transform:uppercase;color:var(--blue);margin-bottom:4px;letter-spacing:.5px}
.illustration{background:var(--white);border-radius:12px;padding:16px;margin:14px 0;text-align:center;border:2px solid var(--gray-l)}
.illustration img{max-width:100%;height:auto;border-radius:8px}
.illustration-caption{font-size:.76rem;color:var(--text-l);margin-top:6px;font-style:italic}

/* ===== PLACE VALUE CHART ===== */
.pv-chart{margin:14px auto;max-width:520px;overflow-x:auto}
.pv-chart table{border-collapse:collapse;width:100%;font-size:.85rem}
.pv-chart th{background:var(--blue);color:#fff;padding:8px 6px;font-weight:800;text-align:center;font-size:.72rem;text-transform:uppercase}
.pv-chart th.comma-col{background:var(--yellow)}
.pv-chart td{text-align:center;padding:10px 6px;border:1px solid var(--gray-l);font-weight:800;font-size:1.1rem}
.pv-chart td.comma-cell{background:#fff8e1;font-size:1.3rem;color:#a07200}
.pv-chart .group-header th{background:var(--blue-d);font-size:.62rem}
.pv-chart .group-header th.bulat{background:var(--green)}
.pv-chart .group-header th.pecahan{background:var(--purple)}
.pv-chart .highlight-cell{background:#fff3cd;border:2px solid var(--yellow)}

/* ===== DECIMAL VISUAL ===== */
.decimal-visual{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:14px 0}
.decimal-block{display:flex;flex-direction:column;align-items:center;gap:6px}
.decimal-block .shape{width:60px;height:60px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.1rem}
.decimal-block .one{background:var(--green);color:#fff;border-radius:8px}
.decimal-block .tenth{background:var(--blue);color:#fff;border-radius:4px;width:60px;height:30px}
.decimal-block .hundredth{background:var(--purple);color:#fff;border-radius:2px;width:15px;height:15px}
.decimal-block .label{font-size:.68rem;color:var(--text-l);font-weight:700;text-align:center}

/* ===== QUESTION ===== */
.question{background:var(--white);border:2px solid var(--gray-l);border-radius:12px;padding:18px 22px;margin:0;transition:all .2s}
.question.correct{border-color:var(--green);background:#f4ffe8}
.question.incorrect{border-color:var(--red);background:#fff0f0}
.question-number{display:inline-block;background:var(--blue);color:#fff;font-weight:900;font-size:.7rem;padding:2px 10px;border-radius:10px;margin-bottom:10px;letter-spacing:.3px}
.question-text{font-size:1.05rem;font-weight:700;margin-bottom:15px;line-height:1.6}
.options{display:grid;gap:8px}
.option{font-family:inherit;text-align:left;padding:12px 14px;border:2px solid var(--gray-l);border-radius:12px;background:var(--white);cursor:pointer;font-weight:600;color:var(--text);font-size:.95rem;transition:all .1s;display:flex;align-items:center;gap:10px;box-shadow:0 2px 0 var(--gray-l)}
.option:hover:not(:disabled){border-color:var(--blue);background:#f0f8ff;transform:translateY(-1px)}
.option:disabled{cursor:not-allowed;opacity:.85;transform:none;box-shadow:none}
.option .opt-letter{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;background:var(--gray-bg);border-radius:50%;font-weight:900;font-size:.8rem;flex-shrink:0}
.option.selected{border-color:var(--blue);background:#e5f6ff;color:var(--blue-d);box-shadow:0 2px 0 var(--blue-d)}
.option.selected .opt-letter{background:var(--blue);color:#fff}
.option.correct{background:#f4ffe8;border-color:var(--green);color:var(--green-d);box-shadow:0 2px 0 var(--green-d)}
.option.correct .opt-letter{background:var(--green);color:#fff}
.option.incorrect{background:#fff0f0;border-color:var(--red);color:var(--red);box-shadow:0 2px 0 var(--red)}
.option.incorrect .opt-letter{background:var(--red);color:#fff}

.feedback{margin-top:15px;padding:13px 15px;border-radius:10px;font-size:.9rem;display:block}
.feedback.correct{background:#f4ffe8;border-left:4px solid var(--green)}
.feedback.incorrect{background:#fff0f0;border-left:4px solid var(--red)}
.feedback-title{font-weight:900;margin-bottom:5px;display:flex;align-items:center;gap:6px}
.feedback.correct .feedback-title{color:var(--green-d)}
.feedback.incorrect .feedback-title{color:var(--red)}
.feedback .correct-answer{margin:6px 0;font-weight:700}
.feedback .explanation{color:var(--text);line-height:1.6;font-size:.88rem}
.word-problem-tag{display:inline-block;background:var(--purple);color:#fff;font-size:.6rem;font-weight:900;padding:2px 8px;border-radius:6px;margin-left:6px;text-transform:uppercase;letter-spacing:.5px;vertical-align:middle}

/* ===== SLIDE NAVIGATION ===== */
.slide-nav{margin-top:24px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.nav-right{display:flex;gap:10px;margin-left:auto}

/* ===== CONSOLIDATION ===== */
.consolidation-box{background:linear-gradient(135deg,#e0f7ff,#fff);border:2px solid var(--blue);border-radius:16px;padding:28px;text-align:center}
.consolidation-box h3{color:var(--blue-d);margin-bottom:10px;font-size:1.2rem}
.consolidation-box p{color:var(--text);margin-bottom:16px;line-height:1.7}

/* ===== MODAL ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:16px;padding:28px;max-width:480px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h2{color:var(--green);margin-bottom:16px;font-size:1.3rem;display:flex;align-items:center;gap:10px}
.modal ul{list-style:none}
.modal ul li{padding:12px 16px;background:var(--gray-bg);border-radius:10px;margin-bottom:10px;display:flex;align-items:center;gap:12px;font-weight:600;font-size:.92rem}
.modal ul li::before{content:"✓";background:var(--green);color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0;font-size:.85rem}
.modal-close{margin-top:20px;width:100%;background:var(--green);color:#fff;border:none;padding:12px;border-radius:10px;font-weight:900;cursor:pointer;font-family:inherit;font-size:.95rem;box-shadow:0 4px 0 var(--green-d)}
.modal-close:active{transform:translateY(2px);box-shadow:0 2px 0 var(--green-d)}

/* ===== ASSIGNMENT ===== */
.assignment-section{margin-bottom:40px;background:var(--white);border-radius:var(--r);overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.04);scroll-margin-top:90px}
.assignment-header-bar{background:linear-gradient(135deg,var(--purple),#a855f7);color:#fff;padding:20px 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.assignment-header-bar h2{color:#fff;font-size:1.3rem;font-weight:900}
.assignment-header-bar .meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.assignment-header-bar .badge{background:rgba(255,255,255,.22);padding:4px 12px;border-radius:8px;font-size:.78rem;font-weight:800}
.assignment-actions{padding:14px 28px;display:flex;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--gray-l)}
.assignment-body{padding:24px 28px}

/* ===== ANSWER SHEET ===== */
.answer-sheet{background:var(--white);border-radius:12px;overflow:hidden;border:2px solid var(--gray-l);margin:0 0 24px 0}
.answer-sheet-title{background:var(--gray-bg);padding:10px 16px;font-weight:900;font-size:.82rem;color:var(--text);text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--gray-l)}
.answer-sheet table{width:100%;border-collapse:collapse;font-size:.8rem}
.answer-sheet th{background:var(--gray-bg);padding:8px;text-align:left;font-weight:900;font-size:.66rem;color:var(--text-l);text-transform:uppercase;border-bottom:2px solid var(--gray-l);letter-spacing:.3px}
.answer-sheet td{padding:8px;border-bottom:1px solid var(--gray-l);vertical-align:top}
.answer-sheet tr:last-child td{border-bottom:none}
.answer-sheet .v{color:var(--green);font-weight:900;font-size:1rem}
.answer-sheet .x{color:var(--red);font-weight:900;font-size:1rem}
.answer-sheet .q-summary{font-size:.74rem;color:var(--text);max-width:280px;line-height:1.3}
.checked-by{text-align:right;padding:20px 28px;border-top:2px solid var(--gray-l);background:var(--gray-bg)}
.checked-by p{font-size:.85rem;font-weight:700;color:var(--text)}
.checked-by .name{font-size:1.1rem;font-weight:900;color:var(--green);margin-top:24px}

/* ===== PRINT ===== */
.print-container{display:none}
body.printing .top-header,
body.printing .student-info,
body.printing .map-path,
body.printing .main-container{display:none !important}
body.printing .print-container{display:block;padding:20px}
body.printing .print-container .print-header{text-align:center;margin-bottom:20px;border-bottom:3px solid var(--green);padding-bottom:16px}
body.printing .print-container .print-header h1{color:var(--green);font-size:1.4rem}
body.printing .print-container .print-info{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0;font-size:.85rem}
body.printing .print-container .print-info div{padding:4px 0}
body.printing .print-container .assignment-section{box-shadow:none;border:2px solid #ccc;border-radius:8px;margin-bottom:16px}
body.printing .print-container .slide{display:block !important;page-break-inside:avoid;margin-bottom:15px}
body.printing .print-container .slide-nav{display:none !important}
body.printing .print-container .progress-bar{display:none}
body.printing .print-container .option{border:1px solid #ccc !important;background:#fff !important;color:#000 !important;box-shadow:none !important;padding:6px 10px}
body.printing .print-container .option .opt-letter{background:#eee !important;color:#000 !important}
body.printing .print-container .question{border:1px solid #ccc !important;page-break-inside:avoid}
body.printing .print-container .feedback{display:none}
body.printing .print-container .answer-sheet{page-break-inside:avoid}

/* ===== RESPONSIVE ===== */
@media(max-width:768px){
  .main-container{grid-template-columns:1fr}
  .sidebar{position:static;height:auto;border-right:none;border-bottom:2px solid var(--gray-l);max-height:none}
  .content-area{padding:16px}
  .top-header{flex-direction:column;align-items:stretch}
}

.katex{font-size:1.02em}
.theory .katex{font-size:1.08em}
</style>
</head>
<body>

<!-- ===== TOP HEADER ===== -->
<header class="top-header">
  <div class="header-left">
    <div class="header-logo">D</div>
    <div>
      <h1>Math Tutoring by Deni</h1>
      <div class="subtitle">Topic: <strong>Nilai Tempat Desimal</strong></div>
    </div>
  </div>
  <button class="btn btn-outline" id="classRulesBtn">📋 Class Rules</button>
</header>

<!-- ===== STUDENT INFO BAR ===== -->
<div class="student-info" id="studentInfoHeader">
  <div class="info-field">
    <label>Name</label>
    <input type="text" data-field="name" placeholder="Nama siswa">
  </div>
  <div class="info-field">
    <label>Date</label>
    <input type="date" data-field="date">
  </div>
  <div class="info-field">
    <label>Assignment Group</label>
    <input type="text" data-field="group" placeholder="Mis. Group A">
  </div>
  <div class="info-field">
    <label>Active Score</label>
    <div class="score-badge">
      <div class="label">Score</div>
      <div class="value"><span id="activeScore">0</span>/10</div>
    </div>
  </div>
</div>

<!-- ===== MAP PATH ===== -->
<section class="map-path">
  <div class="map-track" id="mapTrack"></div>
</section>

<!-- ===== MAIN CONTAINER ===== -->
<div class="main-container">
  <aside class="sidebar">
    <h3>📍 Navigasi Materi</h3>
    <nav>
      <ul class="sidebar-nav" id="sidebarNav"></ul>
    </nav>
  </aside>
  
  <main class="content-area" id="contentArea"></main>
</div>

<!-- ===== CLASS RULES MODAL ===== -->
<div class="modal-overlay" id="classRulesModal">
  <div class="modal">
    <h2>📋 Aturan Kelas</h2>
    <ul>
      <li>Berbicara secara bergantian</li>
      <li>Meminta izin jika ingin meninggalkan kelas</li>
      <li>Menyalakan kamera dan microphone jika diperlukan</li>
    </ul>
    <button class="modal-close" id="closeModalBtn">Mengerti</button>
  </div>
</div>

<!-- ===== PRINT CONTAINER ===== -->
<div class="print-container" id="printContainer"></div>

<!-- ===== SCRIPTS ===== -->
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script>
const courseContent = {
  topic: "Nilai Tempat Desimal",
  sections: []
};

/* ===== CHAT 1: SECTION 1 — SPIRAL REVIEW WARM-UP ===== */
courseContent.sections.push({
  id: 'section1',
  title: 'Spiral Review Warm-up',
  duration: '00:00-00:10',
  icon: '🔄',
  type: 'lesson',
  items: [
    {
      type: 'theory',
      title: 'Konsep Dasar Bilangan Desimal',
      content: `
        <p>Bilangan desimal adalah cara menuliskan bilangan yang menggunakan tanda <strong>koma (,)</strong> sebagai pemisah antara <strong>bagian bulat</strong> dan <strong>bagian pecahan</strong>. Di Indonesia, pemisah desimal menggunakan koma, sedangkan beberapa negara menggunakan titik.</p>
        <div class="example">
          <div class="example-label">Contoh</div>
          Pada bilangan $3{,}5$: angka <strong>3</strong> adalah bagian bulat (tempat satuan), dan angka <strong>5</strong> adalah bagian pecahan (tempat persepuluhan). Bilangan ini dibaca "<em>tiga koma lima</em>".
        </div>
        <div class="illustration">
          <div class="pv-chart">
            <table>
              <tr class="group-header">
                <th colspan="1" class="bulat">Bagian Bulat</th>
                <th class="comma-col"></th>
                <th colspan="2" class="pecahan">Bagian Pecahan</th>
              </tr>
              <tr>
                <th>Satuan</th>
                <th class="comma-col">,</th>
                <th>Persepuluhan</th>
                <th>Perseratusan</th>
              </tr>
              <tr>
                <td>3</td>

/* ================================================================
   RENDER ENGINE (SLIDE-BASED)
   ================================================================ */
const LETTERS = ['a','b','c','d','e'];

function renderKaTeX(el){
  if(typeof renderMathInElement !== 'undefined'){
    renderMathInElement(el, {
      delimiters: [
        {left:'$$',right:'$$',display:true},
        {left:'$',right:'$',display:false}
      ],
      throwOnError:false
    });
  }
}

function renderTheorySlide(item, idx, total, sectionId){
  const prevBtn = idx > 0 ? `<button class="btn btn-outline prev-btn">← Kembali</button>` : `<div></div>`;
  return `
    <div class="slide ${idx===0?'active':''}" data-slide-index="${idx}">
      <div class="theory">
        <h3>📖 ${item.title}</h3>
        ${item.content}
      </div>
      <div class="slide-nav">
        ${prevBtn}
        <div class="nav-right">
          <button class="btn btn-green next-btn">Lanjut →</button>
        </div>
      </div>
    </div>`;
}

function renderMCQSlide(item, qNum, idx, sectionId){
  const correctLetter = LETTERS[item.correct];
  let summary = item.q.replace(/\$/g,'').replace(/\\frac\{([^}]+)\}\{([^}]+)\}/g,'$1/$2').replace(/\\times/g,'×').substring(0,70);
  if(item.q.length > 70) summary += '...';
  
  let optsHTML = '';
  item.opts.forEach((opt,i)=>{
    optsHTML += `<button class="option" data-option="${LETTERS[i]}"><span class="opt-letter">${LETTERS[i].toUpperCase()}</span><span>${opt}</span></button>`;
  });
  
  const wpTag = item.wp ? '<span class="word-problem-tag">Soal Cerita</span>' : '';
  const prevBtn = idx > 0 ? `<button class="btn btn-outline prev-btn">← Kembali</button>` : `<div></div>`;
  
  return `
    <div class="slide ${idx===0?'active':''}" data-slide-index="${idx}" data-correct="${correctLetter}" data-summary="${summary.replace(/"/g,'&quot;')}">
      <div class="question">
        <span class="question-number">Soal ${qNum}</span>${wpTag}
        <div class="question-text">${item.q}</div>
        ${item.illustration ? `<div class="illustration">${item.illustration}</div>` : ''}
        <div class="options">${optsHTML}</div>
        <div class="feedback" style="display:none">
          <div class="feedback-title"></div>
          <div class="correct-answer">Jawaban benar: <strong>${correctLetter.toUpperCase()}</strong></div>
          <div class="explanation">${item.exp}</div>
        </div>
      </div>
      <div class="slide-nav">
        ${prevBtn}
        <div class="nav-right">
          <button class="btn btn-blue check-btn" disabled>Periksa</button>
          <button class="btn btn-yellow retry-btn" style="display:none">↻ Coba Lagi</button>
          <button class="btn btn-green next-btn">Lanjut →</button>
        </div>
      </div>
    </div>`;
}

function renderSection(section){
  let slidesHTML = '';
  let qCounter = 0;
  const totalSlides = section.items.length;
  
  section.items.forEach((item, i)=>{
    if(item.type === 'theory'){
      slidesHTML += renderTheorySlide(item, i, totalSlides, section.id);
    } else if(item.type === 'mcq'){
      qCounter++;
      slidesHTML += renderMCQSlide(item, qCounter, i, section.id);
    }
  });
  
  return `
    <section id="${section.id}" class="section">
      <div class="section-header">
        <div class="section-icon">${section.icon}</div>
        <div class="section-title">
          <h2>${section.title}</h2>
          <span class="section-duration">⏱️ ${section.duration}</span>
        </div>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${100/totalSlides}%"></div></div>
      <div class="slide-wrapper">${slidesHTML}</div>
    </section>`;
}

  return `
    <section id="${section.id}" class="section">

function renderAssignment(section){
  const num = section.assignmentNum;
  let qCounter = 0;
  let slidesHTML = '';
  let sheetRows = '';
  const totalSlides = section.items.length;
  
  section.items.forEach((item, i)=>{
    if(item.type === 'mcq'){
      qCounter++;
      slidesHTML += renderMCQSlide(item, qCounter, i, section.id);
      let summary = item.q.replace(/\$/g,'').replace(/\\frac\{([^}]+)\}\{([^}]+)\}/g,'$1/$2').replace(/\\times/g,'×').substring(0,70);
      if(item.q.length > 70) summary += '...';
      sheetRows += `<tr data-q="${qCounter}">
        <td>${qCounter}</td>
        <td class="q-summary">${summary}</td>
        <td class="student-answer">-</td>
        <td class="correct-answer">-</td>
        <td class="status">-</td>
      </tr>`;
    }
  });
  
  return `
    <section id="${section.id}" class="assignment-section" data-assignment-num="${num}">
      <div class="assignment-header-bar">
        <h2>${section.icon} ${section.title}</h2>
        <div class="meta">
          <span class="badge">10 Soal</span>
          <span class="badge">Skor: <span id="score-${num}">0</span>/10</span>
        </div>
      </div>
      <div class="assignment-actions">
        <button class="btn btn-blue print-btn" data-target="${section.id}">🖨️ Print Assignment</button>
      </div>
      <div class="assignment-body">
        <div class="answer-sheet">
          <div class="answer-sheet-title">📋 Lembar Penilaian</div>
          <table id="answer-sheet-${num}">
            <thead>
              <tr><th>No.</th><th>Question</th><th>Student Answer</th><th>Correct Answer</th><th>v/x</th></tr>
            </thead>
            <tbody>${sheetRows}</tbody>
          </table>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:${100/totalSlides}%"></div></div>
        <div class="slide-wrapper">${slidesHTML}</div>
      </div>
      <div class="checked-by">
        <p>Checked by,</p>
        <p class="name">Deni</p>
      </div>
    </section>`;
}

function renderAll(){
  const contentArea = document.getElementById('contentArea');
  const sidebarNav = document.getElementById('sidebarNav');
  const mapTrack = document.getElementById('mapTrack');
  
  let contentHTML = '';
  let sidebarHTML = '';
  let mapHTML = '';
  
  courseContent.sections.forEach((section, idx)=>{
    if(section.type === 'assignment'){
      contentHTML += renderAssignment(section);
    } else if(section.type === 'consolidation'){
      contentHTML += renderConsolidation(section);
    } else {
      contentHTML += renderSection(section);
    }
    
    const isAssignment = section.type === 'assignment';
    sidebarHTML += `<li><a href="#${section.id}" data-target="${section.id}" class="${isAssignment?'assignment-link':''}">
      ${section.icon} ${section.title}
      <span class="dur">${section.duration}</span>
    </a></li>`;
    
    mapHTML += `<div class="map-node" data-target="${section.id}" title="${section.title}">${section.icon}
      <div class="map-label">${section.title}<span class="dur">${section.duration}</span></div>
    </div>`;
    if(idx < courseContent.sections.length - 1){
      mapHTML += `<div class="map-connector"></div>`;
    }
  });
  
  contentArea.innerHTML = contentHTML;
  sidebarNav.innerHTML = sidebarHTML;
  mapTrack.innerHTML = mapHTML;
  
  renderKaTeX(contentArea);
  setupSlides();
  setupSidebarTracking();
  setupMapNodes();
  setupPrintButtons();
}

/* ===== SLIDE LOGIC ===== */
function setupSlides(){
  document.querySelectorAll('.section, .assignment-section').forEach(section=>{
    const slides = section.querySelectorAll('.slide');
    const progressFill = section.querySelector('.progress-fill');
    
    slides.forEach((slide, index)=>{
      const checkBtn = slide.querySelector('.check-btn');
      const retryBtn = slide.querySelector('.retry-btn');
      const nextBtn = slide.querySelector('.next-btn');
      const prevBtn = slide.querySelector('.prev-btn');
      const options = slide.querySelectorAll('.option');
      
      // Previous slide logic
      if(prevBtn){
        prevBtn.addEventListener('click', ()=>{
          if(index > 0){
            slides[index].classList.remove('active');
            slides[index-1].classList.add('active');
            const progress = (index / slides.length) * 100;
            progressFill.style.width = progress + '%';
            section.scrollIntoView({behavior:'smooth', block:'start'});
          }
        });
      }
      
      // Option selection
      options.forEach(opt=>{
        opt.addEventListener('click', ()=>{
          if(opt.disabled) return;
          options.forEach(o=>o.classList.remove('selected'));
          opt.classList.add('selected');
          if(checkBtn) checkBtn.disabled = false;
        });
      });
      
      // Check answer
      if(checkBtn){
        checkBtn.addEventListener('click', ()=>{
          const selected = slide.querySelector('.option.selected');
          if(!selected) return;
          const correctAnswer = slide.dataset.correct;
          const isCorrect = selected.dataset.option === correctAnswer;
          
          options.forEach(o=>o.disabled = true);
          selected.classList.remove('selected');
          
          const feedback = slide.querySelector('.feedback');
          feedback.style.display = 'block';
          
          if(isCorrect){
            selected.classList.add('correct');
            slide.querySelector('.question').classList.add('correct');
            feedback.classList.add('correct');
            feedback.classList.remove('incorrect');
            feedback.querySelector('.feedback-title').innerHTML = '✓ Jawaban Benar!';
            checkBtn.style.display = 'none';
          } else {
            selected.classList.add('incorrect');
            slide.querySelector('.question').classList.add('incorrect');
            feedback.classList.add('incorrect');
            feedback.classList.remove('correct');
            feedback.querySelector('.feedback-title').innerHTML = '✗ Belum Tepat';
            options.forEach(o=>{
              if(o.dataset.option === correctAnswer) o.classList.add('correct');
            });
            checkBtn.style.display = 'none';
            retryBtn.style.display = 'block';
          }
          
          updateAnswerSheet(slide);
        });
      }
      
      // Retry
      if(retryBtn){
        retryBtn.addEventListener('click', ()=>{
          options.forEach(o=>{
            o.disabled = false;
            o.classList.remove('correct','incorrect','selected');
          });
          slide.querySelector('.question').classList.remove('correct','incorrect');
          const feedback = slide.querySelector('.feedback');
          feedback.style.display = 'none';
          feedback.classList.remove('correct','incorrect');
          retryBtn.style.display = 'none';
          checkBtn.style.display = 'block';
          checkBtn.disabled = true;
        });
      }
      
      // Next slide
      if(nextBtn){
        nextBtn.addEventListener('click', ()=>{
          if(index < slides.length - 1){
            slides[index].classList.remove('active');
            slides[index+1].classList.add('active');
            const progress = ((index + 1) / slides.length) * 100;
            progressFill.style.width = progress + '%';
            section.scrollIntoView({behavior:'smooth', block:'start'});
          } else {
            progressFill.style.width = '100%';
            section.classList.add('completed');
            updateMapProgress();
          }
        });
      }
    });
  });
}

function updateAnswerSheet(slide){
  const assignment = slide.closest('.assignment-section');
  if(!assignment) return;
  
  const assignmentNum = assignment.dataset.assignmentNum;
  const questions = Array.from(assignment.querySelectorAll('.slide'));
  const qIdx = questions.indexOf(slide) + 1;
  
  const row = document.querySelector(`#answer-sheet-${assignmentNum} tr[data-q="${qIdx}"]`);
  if(!row) return;
  
  const selectedOpt = slide.querySelector('.option.correct, .option.incorrect');
  const isCorrect = slide.querySelector('.question').classList.contains('correct');
  const isAnswered = selectedOpt !== null;
  
  row.querySelector('.student-answer').textContent = isAnswered ? selectedOpt.dataset.option.toUpperCase() : '-';
  row.querySelector('.correct-answer').textContent = slide.dataset.correct.toUpperCase();
  const statusCell = row.querySelector('.status');
  statusCell.textContent = isAnswered ? (isCorrect ? 'v' : 'x') : '-';
  statusCell.className = 'status ' + (isAnswered ? (isCorrect ? 'v' : 'x') : '');
  
  const correctCount = assignment.querySelectorAll('.question.correct').length;
  const scoreEl = document.getElementById(`score-${assignmentNum}`);
  if(scoreEl) scoreEl.textContent = correctCount;
  
  const activeScoreEl = document.getElementById('activeScore');
  if(activeScoreEl && isAssignmentInView(assignment)){
    activeScoreEl.textContent = correctCount;
  }
}

function isAssignmentInView(assignment){
  const rect = assignment.getBoundingClientRect();
  return rect.top < window.innerHeight && rect.bottom > 0;
}

/* ===== SIDEBAR TRACKING ===== */
function setupSidebarTracking(){
  const sections = document.querySelectorAll('.section, .assignment-section');
  const navLinks = document.querySelectorAll('.sidebar-nav a');
  
  const observer = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        const id = entry.target.id;
        navLinks.forEach(link=>{
          link.classList.toggle('active', link.dataset.target === id);
        });
        const assignment = entry.target.closest('.assignment-section');
        if(assignment){
          const num = assignment.dataset.assignmentNum;
          const score = assignment.querySelectorAll('.question.correct').length;
          const activeScoreEl = document.getElementById('activeScore');
          if(activeScoreEl) activeScoreEl.textContent = score;
        }
      }
    });
  }, {threshold:0.15, rootMargin:'-100px 0px -50% 0px'});
  
  sections.forEach(s=>observer.observe(s));
  
  navLinks.forEach(link=>{
    link.addEventListener('click', e=>{
      e.preventDefault();
      const target = document.getElementById(link.dataset.target);
      if(target) target.scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
}

/* ===== MAP NODES ===== */
function setupMapNodes(){
  document.querySelectorAll('.map-node').forEach(node=>{
    node.addEventListener('click', ()=>{
      const target = document.getElementById(node.dataset.target);

}

/* ===== PRINT ===== */
function setupPrintButtons(){
  document.querySelectorAll('.print-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      printAssignment(btn.dataset.target);
    });
  });
}

function printAssignment(assignmentId){
  const assignment = document.getElementById(assignmentId);
  if(!assignment) return;
  
  const studentInfo = document.getElementById('studentInfoHeader');
  const name = studentInfo.querySelector('[data-field="name"]').value || '______';
  const date = studentInfo.querySelector('[data-field="date"]').value || '______';
  const group = studentInfo.querySelector('[data-field="group"]').value || '______';
  const num = assignment.dataset.assignmentNum;
  const score = document.getElementById(`score-${num}`).textContent;
  
  const printContainer = document.getElementById('printContainer');
  printContainer.innerHTML = `
    <div class="print-header">
      <h1>Math Tutoring by Deni</h1>
      <p><strong>Topic:</strong> ${courseContent.topic}</p>
    </div>
    <div class="print-info">
      <div><strong>Name:</strong> ${name}</div>
      <div><strong>Date:</strong> ${date}</div>
      <div><strong>Assignment Group:</strong> ${group}</div>
      <div><strong>Score:</strong> ${score}/10</div>
    </div>
  `;
  
  const clone = assignment.cloneNode(true);
  // Make all slides visible for print
  clone.querySelectorAll('.slide').forEach(s => s.classList.add('active'));
  clone.querySelectorAll('.slide-nav').forEach(n => n.style.display = 'none');
  clone.querySelectorAll('.progress-bar').forEach(p => p.style.display = 'none');
  clone.querySelectorAll('.feedback').forEach(f => f.style.display = 'none');
  clone.querySelectorAll('.option').forEach(o => {
    o.disabled = false;
    o.classList.remove('correct','incorrect','selected');
  });
  
  printContainer.appendChild(clone);
  
  document.body.classList.add('printing');
  window.print();
  
  setTimeout(()=>{
    document.body.classList.remove('printing');
    printContainer.innerHTML = '';
  }, 500);
}
