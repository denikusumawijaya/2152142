    <style>
        :root {
            --primary: #58cc02;
            --primary-dark: #46a302;
            --primary-light: #e7f6d8;
            --secondary: #1cb0f6;
            --error: #ff4b4b;
            --error-light: #ffeded;
            --bg-color: #f7f7f7;
            --text-color: #3c3c3c;
            --border-color: #e5e5e5;
            --shadow: 0 4px 0 rgba(0,0,0,0.1);
            --transition: all 0.2s ease-in-out;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            min-height: 100vh;
        }

        /* Navbar Left */
        .navbar {
            width: 280px;
            background: #fff;
            border-right: 2px solid var(--border-color);
            padding: 20px;
            height: 100vh;
            position: fixed;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 100;
        }

        .navbar-header {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-item {
            padding: 12px 15px;
            margin-bottom: 5px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            color: #afafaf;
            border: 2px solid transparent;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-item:hover {
            background-color: var(--primary-light);
            color: var(--primary-dark);
        }

        .nav-item.active {
            background-color: var(--primary-light);
            color: var(--primary-dark);
            border-color: var(--primary);
        }

        .nav-item.completed {
            color: var(--primary);
        }
        
        .nav-item.completed::before {
            content: '✓';
            color: #fff;
            background: var(--primary);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }

        .nav-section-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #c0c0c0;
            margin: 20px 0 10px 5px;
            letter-spacing: 1px;
        }

        /* Main Content */
        .main-content {
            margin-left: 280px;
            flex: 1;
            padding: 40px;
            display: flex;
            justify-content: center;
            width: calc(100% - 280px);
        }

        .card-container {
            width: 100%;
            max-width: 700px;
            background: #fff;
            border-radius: 20px;
            box-shadow: var(--shadow);
            border: 2px solid var(--border-color);
            padding: 30px;
            position: relative;
            min-height: 500px;
            animation: slideIn 0.4s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-color);
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: var(--border-color);
            border-radius: 10px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 10px;
            transition: width 0.4s ease;
        }

        .theory-box {
            background: #f0faff;
            border: 2px solid #b9eaff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .theory-box h3 {
            color: var(--secondary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .exercise-box {
            background: #fff;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .options-grid {
            display: grid;
            gap: 10px;
        }

        .option-btn {
            padding: 15px;
            border: 2px solid var(--border-color);
            background: #fff;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            color: var(--text-color);
            text-align: left;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--secondary);
            background: #f0faff;
        }

        .option-btn.selected {
            border-color: var(--secondary);
            background: #e7f6d8;
            color: var(--primary-dark);
        }

        .option-btn.correct {
            border-color: var(--primary);
            background: var(--primary-light);
            color: var(--primary-dark);
        }

        .option-btn.incorrect {
            border-color: var(--error);
            background: var(--error-light);
            color: var(--error);
        }

        .input-answer {
            width: 100%;
            padding: 15px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
        }

        .input-answer:focus {
            outline: none;
            border-color: var(--secondary);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 0 var(--primary-dark);
        }

        .btn-primary:hover {
            filter: brightness(1.1);
        }
        
        .btn-primary:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .btn-secondary {
            background: #fff;
            color: var(--text-color);
            border: 2px solid var(--border-color);
            box-shadow: 0 4px 0 var(--border-color);
        }

        .btn-secondary:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .btn-danger {
            background: #fff;
            color: var(--error);
            border: 2px solid var(--error);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        .feedback-collapse {
            margin-top: 15px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            background: #fff9f0;
            border-left: 4px solid #ffc800;
            padding: 0 15px;
            border-radius: 4px;
        }

        .feedback-collapse.show {
            max-height: 500px;
            padding: 15px;
        }

        .feedback-title {
            font-weight: 800;
            margin-bottom: 5px;
            color: #e69500;
        }

        /* SVG Illustrations */
        .illustration {
            display: block;
            margin: 20px auto;
            max-width: 150px;
        }

        /* Home Page Specifics */
        .home-rules {
            list-style: none;
            margin-top: 15px;
        }
        .home-rules li {
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            border: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Print Styles */
        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; }
            #printArea {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                padding: 20mm;
            }
            .print-table {
                width: 100%;
                border-collapse: collapse;
                font-size: 12px;
            }
            .print-table th, .print-table td {
                border: 1px solid #000;
                padding: 8px;
                text-align: left;
            }
            @page { size: A4; margin: 10mm; }
        }

        /* Mobile Hamburger */
        .hamburger {
            display: none;
            font-size: 2rem;
            cursor: pointer;
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 101;
            color: var(--primary);
        }

        @media (max-width: 768px) {
            .navbar {
                transform: translateX(-100%);
            }
            .navbar.open {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0;
                width: 100%;
                padding: 80px 20px 20px;
            }
            .hamburger { display: block; }
        }
    </style>
</head>

                    { q: "Jumlahkan $\\frac{1}{4}$ dan $\\frac{2}{5}$ (Bentuk pecahan biasa).", type: 'text', ans: "13/20", exp: "$\\frac{5}{20} + \\frac{8}{20} = \\frac{13}{20}$." },
                    { q: "Kurangi $1$ utuh dengan $\\frac{3}{8}$.", type: 'text', ans: "5/8", exp: "$\\frac{8}{8} - \\frac{3}{8} = \\frac{5}{8}$." }
                ]
            },
            // --- ASSIGNMENT 5 ---
            {
                id: 'assign5',
                title: 'Assignment 5',
                type: 'assignment',
                groupName: 'Assignment 5: Misi Harta Karun',
                questions: [
                    { q: "7 peti dibagi rata ke 3 kapal. Tulis pecahan tidak murninya.", type: 'text', ans: "7/3", exp: "Total 7 bagi 3. $\\frac{7}{3}$." },
                    { q: "Ubah pecahan di atas ke pecahan campuran.", type: 'text', ans: "2 1/3", exp: "$7 : 3 = 2$ sisa $1$." },
                    { q: "Jika 10 batang emas dibagi 4 kru, berapa batang yang didapat 1 kru? (Desimal)", type: 'text', ans: "2.5", exp: "$10 : 4 = 2,5$." },
                    { q: "Ubah jawaban desimal di atas ke pecahan campuran.", type: 'text', ans: "2 1/2", exp: "$2,5 = 2\\frac{1}{2}$." },
                    { q: "Kapten memberi $\\frac{1}{3}$ harta ke Kru A, dan $\\frac{1}{4}$ ke Kru B. Siapa yang dapat lebih banyak?", type: 'mcq', opts: ["Kru A", "Kru B", "Sama", "Tidak tahu"], ans: "Kru A", exp: "$\\frac{1}{3} \\approx 0,33$ dan $\\frac{1}{4} = 0,25$. 0,33 > 0,25." },
                    { q: "Berapa total bagian yang diberikan Kapten ke Kru A dan B? (Pecahan biasa penyebut 12)", type: 'text', ans: "7/12", exp: "$\\frac{4}{12} + \\frac{3}{12} = \\frac{7}{12}$." },
                    { q: "Sisa harta untuk Kapten adalah... (Pecahan biasa penyebut 12)", type: 'text', ans: "5/12", exp: "$\\frac{12}{12} - \\frac{7}{12} = \\frac{5}{12}$." },
                    { q: "Jika harta awalnya 60 koin, berapa koin yang didapat Kapten?", type: 'text', ans: "25", exp: "$\\frac{5}{12} \\times 60 = 25$." },
                    { q: "Kru A mendapat bagian $\\frac{1}{3}$ dari 60 koin. Berapa koin yang didapat Kru A?", type: 'text', ans: "20", exp: "$\\frac{1}{3} \\times 60 = 20$." },
                    { q: "Kru B mendapat bagian $\\frac{1}{4}$ dari 60 koin. Berapa koin yang didapat Kru B?", type: 'text', ans: "15", exp: "$\\frac{1}{4} \\times 60 = 15$." }
                ]
            }
        ];
			
            // NOTE: Data for Section 2, 3, 4, 5, 6, and Assignments will be injected here in the next parts.


        // ==========================================
        // STATE MANAGEMENT
        // ==========================================
        let currentSectionIndex = 0;
        let currentCardIndex = 0;
        let progress = {}; // Menyimpan status selesai card { 'sec1-0': true, ... }

        // ==========================================
        // RENDER FUNCTIONS
        // ==========================================
        function renderNav() {
            const navMenu = document.getElementById('nav-menu');
            navMenu.innerHTML = '';
            
            lessonData.forEach((section, sIndex) => {
                const navItem = document.createElement('div');
                navItem.className = 'nav-item';
                if (sIndex === currentSectionIndex) navItem.classList.add('active');
                
                navItem.innerHTML = `${section.title} ${section.time ? `<span style="font-size:0.8rem; opacity:0.6">(${section.time})</span>` : ''}`;
                navItem.onclick = () => {
                    currentSectionIndex = sIndex;
                    currentCardIndex = 0;
                    renderNav();
                    renderContent();
                    if (window.innerWidth <= 768) toggleNav();
                };
                navMenu.appendChild(navItem);
            });
        }

        function renderContent() {
            const contentArea = document.getElementById('content-area');
            const section = lessonData[currentSectionIndex];
            contentArea.innerHTML = '';

            if (section.type === 'home') {
                renderHome(section);
                return;
            }

            if (section.type === 'assignment') {
                renderAssignment(section);
                return;
            }

            // Standard Section
            const card = section.cards[currentCardIndex];
            const totalCards = section.cards.length;
            const progressPercent = ((currentCardIndex + 1) / totalCards) * 100;

            let cardHTML = `
                <div class="card-header">
                    <div class="card-title">${section.title}</div>
                    <div>${currentCardIndex + 1} / ${totalCards}</div>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${progressPercent}%"></div>
                </div>
            `;

            if (card.type === 'theory') {
                cardHTML += `
                    <div class="theory-box">
                        <h3>📖 ${card.title}</h3>
                        <div>${card.html}</div>
                    </div>
                    <div class="controls">
                        <button class="btn btn-secondary" onclick="prevCard()">← Previous</button>
                        <button class="btn btn-primary" onclick="nextCard()">Next →</button>
                    </div>
                `;
            } else if (card.type === 'exercise') {
                cardHTML += `<div class="exercise-box"><div class="question-text">${card.question}</div><div id="options-container"></div></div>`;
                
                cardHTML += `
                    <div class="feedback-collapse" id="feedback-box">
                        <div class="feedback-title" id="feedback-title"></div>
                        <div id="feedback-text"></div>
                    </div>
                `;

                cardHTML += `
                    <div class="controls">
                        <button class="btn btn-secondary" onclick="prevCard()">← Previous</button>
                        <div style="display:flex; gap:10px;">
                            <button class="btn btn-secondary" onclick="resetCurrentCard()">Reset</button>
                            <button class="btn btn-primary" id="check-btn" onclick="checkAnswer()">Check</button>
                            <button class="btn btn-primary" id="next-btn" onclick="nextCard()">Next →</button>
                        </div>
                    </div>
                `;
            }

            contentArea.innerHTML = cardHTML;

            if (card.type === 'exercise') {
                renderExerciseOptions(card);
            }

            // Render Math
            if (typeof renderMathInElement !== 'undefined') {
                renderMathInElement(contentArea, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ]
                });
            }
        }

        function renderHome(section) {
            const contentArea = document.getElementById('content-area');
            contentArea.innerHTML = `
                <div class="card-header">
                    <div class="card-title">MATH TUTORING by Deni</div>
                </div>
                <h2 style="margin-bottom:10px;">Topic:</h2>
                <p style="font-size:1.2rem; font-weight:700; color:var(--secondary); margin-bottom:20px;">${section.content.topic}</p>
                
                <h3>Aturan Kelas:</h3>
                <ul class="home-rules">
                    ${section.content.rules.map(rule => `<li>✅ ${rule}</li>`).join('')}
                </ul>

                <div style="margin-top:30px; text-align:center;">
                    <svg width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="#58cc02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <div class="controls">
                    <button class="btn btn-primary" style="margin-left:auto;" onclick="nextCard()">Mulai →</button>
                </div>
            `;
        }

        function renderExerciseOptions(card) {
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            if (card.inputType === 'mcq') {
                // Randomisasi opsi
                const shuffled = [...card.options].sort(() => 0.5 - Math.random());
                shuffled.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerHTML = opt;
                    btn.onclick = () => {
                        document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        btn.dataset.value = opt;
                    };
                    container.appendChild(btn);
                });
            } else {
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'input-answer';
                input.id = 'text-answer';
                input.placeholder = "Ketik jawabanmu di sini...";
                container.appendChild(input);
            }
        }

        // ==========================================
        // NAVIGATION LOGIC
        // ==========================================
        function nextCard() {
            const section = lessonData[currentSectionIndex];
            if (section.type === 'home') {
                currentSectionIndex++;
                currentCardIndex = 0;
            } else {
                // Tandai card saat ini sebagai selesai
                progress[`${currentSectionIndex}-${currentCardIndex}`] = true;
                if (currentCardIndex < section.cards.length - 1) {
                    currentCardIndex++;
                } else {
                    // Lanjut ke section berikutnya
                    if (currentSectionIndex < lessonData.length - 1) {
                        currentSectionIndex++;
                        currentCardIndex = 0;
                    }
                }
            }
            updateNavStatus();
            renderNav();
            renderContent();
            window.scrollTo(0, 0);
        }

        function prevCard() {
            if (currentCardIndex > 0) {
                currentCardIndex--;
            } else if (currentSectionIndex > 0) {
                currentSectionIndex--;
                const prevSection = lessonData[currentSectionIndex];
                if (prevSection.type === 'section') {
                    currentCardIndex = prevSection.cards.length - 1;
                } else {
                    currentCardIndex = 0;
                }
            }
            renderNav();
            renderContent();
            window.scrollTo(0, 0);
        }

        function resetCurrentCard() {
            renderContent();
        }

        function resetAllProgress() {
            if(confirm("Apakah kamu yakin ingin mereset SEMUA progress belajar?")) {
                progress = {};
                currentSectionIndex = 0;
                currentCardIndex = 0;
                renderNav();
                renderContent();
            }
        }

        function updateNavStatus() {
            // Logic untuk menambahkan checkmark di navbar jika section sudah selesai
        }

        function toggleNav() {
            document.getElementById('navbar').classList.toggle('open');
        }

        // ==========================================
        // CHECK ANSWER LOGIC
        // ==========================================
        function checkAnswer() {
            const card = lessonData[currentSectionIndex].cards[currentCardIndex];
            let userAnswer = '';
            let isCorrect = false;

            if (card.inputType === 'mcq') {
                const selected = document.querySelector('.option-btn.selected');
                if (!selected) {
                    alert("Pilih salah satu jawaban dulu!");
                    return;
                }
                userAnswer = selected.dataset.value;
                isCorrect = (userAnswer === card.answer);
                
                // Highlight correct/incorrect
                document.querySelectorAll('.option-btn').forEach(btn => {
                    if (btn.dataset.value === card.answer) btn.classList.add('correct');
                    else if (btn.classList.contains('selected')) btn.classList.add('incorrect');
                    btn.disabled = true;
                });

            } else {
                userAnswer = document.getElementById('text-answer').value.trim().toLowerCase().replace(/\s/g, '');
                const correctAnswer = card.answer.toLowerCase().replace(/\s/g, '');
                
                // Normalisasi pecahan sederhana (misal 3/7)
                isCorrect = (userAnswer === correctAnswer);
                
                const inputField = document.getElementById('text-answer');
                if (isCorrect) {
                    inputField.style.borderColor = 'var(--primary)';
                    inputField.style.background = 'var(--primary-light)';
                } else {
                    inputField.style.borderColor = 'var(--error)';
                    inputField.style.background = 'var(--error-light)';
                }
            }

            const feedbackBox = document.getElementById('feedback-box');
            const feedbackTitle = document.getElementById('feedback-title');
            const feedbackText = document.getElementById('feedback-text');

            if (isCorrect) {
                feedbackTitle.innerText = "✅ Benar!";
                feedbackTitle.style.color = 'var(--primary-dark)';
            } else {
                feedbackTitle.innerText = "❌ Belum Tepat. Kunci Jawaban: " + card.answer;
                feedbackTitle.style.color = 'var(--error)';
            }
            
            feedbackText.innerHTML = card.explanation;
            feedbackBox.classList.add('show');

            // Render math inside feedback
            if (typeof renderMathInElement !== 'undefined') {
                renderMathInElement(feedbackBox, {
                    delimiters: [{left: '$', right: '$', display: false}]
                });
            }

            document.getElementById('check-btn').style.display = 'none';
            document.getElementById('next-btn').style.display = 'flex';
        }

        // ==========================================
        // ASSIGNMENT & PRINT LOGIC (Placeholder for Part 4)
        // ==========================================
        function renderAssignment(section) {
            const contentArea = document.getElementById('content-area');
            let html = `
                <div class="card-header">
                    <div class="card-title">${section.title}</div>
                    <div>${section.groupName}</div>
                </div>
                <div class="theory-box">
                    <h3>🏆 Petualangan Akhir</h3>
                    <p>Selesaikan 10 tantangan di bawah ini. Setelah selesai, klik "Check All Answers" untuk melihat skormu, lalu klik "Print Result" untuk mencetak hasil laporan misimu dalam 1 halaman A4!</p>
                </div>
                <form id="assignment-form" onsubmit="return false;">
            `;

            section.questions.forEach((q, i) => {
                html += `<div class="exercise-box" id="q-box-${i}"><div class="question-text">${i + 1}. ${q.q}</div><div id="q-opts-${i}"></div></div>`;
            });

            html += `
                </form>
                <div class="feedback-collapse" id="assignment-feedback" style="background: #e7f6d8; border-left: 4px solid var(--primary);">
                    <div class="feedback-title" id="assign-feedback-title">Skor: 0 / 10</div>
                    <div id="assign-feedback-text">Klik check untuk melihat hasilnya.</div>
                </div>
                <div class="controls">
                    <button class="btn btn-secondary" onclick="prevCard()">← Previous</button>
                    <div style="display:flex; gap:10px;">
                        <button class="btn btn-primary" onclick="checkAssignment('${section.id}')">Check All Answers</button>
                        <button class="btn btn-secondary" id="print-btn" style="display:none;" onclick="printResult('${section.id}')">🖨️ Print Result</button>
                        <button class="btn btn-primary" onclick="nextCard()">Next →</button>
                    </div>
                </div>
            `;

            contentArea.innerHTML = html;

            // Render inputs
            section.questions.forEach((q, i) => {
                const container = document.getElementById(`q-opts-${i}`);
                if (q.type === 'mcq') {
                    const shuffled = [...q.opts].sort(() => 0.5 - Math.random());
                    shuffled.forEach(opt => {
                        const btn = document.createElement('button');
                        btn.className = 'option-btn';
                        btn.innerHTML = opt;
                        btn.onclick = (e) => {
                            e.preventDefault();
                            const box = container.querySelectorAll('.option-btn');
                            box.forEach(b => b.classList.remove('selected'));
                            btn.classList.add('selected');
                            btn.dataset.value = opt;
                        };
                        container.appendChild(btn);
                    });
                } else {
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.className = 'input-answer';
                    input.id = `ans-${i}`;
                    input.placeholder = "Jawaban...";
                    container.appendChild(input);
                }
            });

            if (typeof renderMathInElement !== 'undefined') {
                renderMathInElement(contentArea, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ]
                });
            }
        }

        function checkAssignment(sectionId) {
            const section = lessonData.find(s => s.id === sectionId);
            let score = 0;
            let resultsHTML = '';
            let studentData = [];

            section.questions.forEach((q, i) => {
                let userAnswer = '';
                let isCorrect = false;

                if (q.type === 'mcq') {
                    const selected = document.querySelector(`#q-opts-${i} .option-btn.selected`);
                    userAnswer = selected ? selected.dataset.value : "(Kosong)";
                    isCorrect = (userAnswer === q.ans);
                    
                    document.querySelectorAll(`#q-opts-${i} .option-btn`).forEach(btn => {
                        if (btn.dataset.value === q.ans) btn.classList.add('correct');
                        else if (btn.classList.contains('selected')) btn.classList.add('incorrect');
                        btn.disabled = true;
                    });
                } else {
                    const input = document.getElementById(`ans-${i}`);
                    userAnswer = input.value.trim().toLowerCase().replace(/\s/g, '');
                    const correctAnswer = q.ans.toLowerCase().replace(/\s/g, '');
                    isCorrect = (userAnswer === correctAnswer);
                    
                    if (isCorrect) {
                        input.style.borderColor = 'var(--primary)';
                        input.style.background = 'var(--primary-light)';
                    } else {
                        input.style.borderColor = 'var(--error)';
                        input.style.background = 'var(--error-light)';
                    }
                }

                if (isCorrect) score++;
                
                studentData.push({
                    q: q.q,
                    userAns: userAnswer,
                    correctAns: q.ans,
                    isCorrect: isCorrect
                });

                resultsHTML += `<p><strong>${i+1}.</strong> ${isCorrect ? '✅ Benar' : '❌ Salah'}. ${q.exp}</p>`;
            });

            const feedbackBox = document.getElementById('assignment-feedback');
            const feedbackTitle = document.getElementById('assign-feedback-title');
            const feedbackText = document.getElementById('assign-feedback-text');
            
            feedbackTitle.innerText = `Skor: ${score} / 10`;
            feedbackText.innerHTML = resultsHTML;
            feedbackBox.classList.add('show');

            if (typeof renderMathInElement !== 'undefined') {
                renderMathInElement(feedbackBox, {
                    delimiters: [{left: '$', right: '$', display: false}]
                });
            }

            document.getElementById('print-btn').style.display = 'flex';
            
            // Simpan data sementara untuk print
            window.currentPrintData = { section, score, studentData };
        }

        function printResult(sectionId) {
            if (!window.currentPrintData) {
                alert("Klik 'Check All Answers' dulu sebelum print!");
                return;
            }

            const { section, score, studentData } = window.currentPrintData;
            const topic = "Konsep Pecahan & Jenisnya (Membagi Harta Karun)";
            const dateStr = new Date().toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' });

            let tableRows = '';
            studentData.forEach((data, i) => {
                // Hapus tag math latex untuk tampilan print plain text agar rapi
                const cleanQ = data.q.replace(/\$\$/g, '').replace(/\$/g, '').replace(/\\frac\{(.*?)\}\{(.*?)\}/g, "($1)/($2)");
                const cleanUser = (data.userAns === '(Kosong)' ? '-' : data.userAns).replace(/\$\$/g, '').replace(/\$/g, '');
                const cleanCorrect = data.correctAns.replace(/\$\$/g, '').replace(/\$/g, '').replace(/\\frac\{(.*?)\}\{(.*?)\}/g, "($1)/($2)");
                
                tableRows += `
                    <tr>
                        <td style="text-align:center">${i + 1}</td>
                        <td>${cleanQ}</td>
                        <td>${cleanUser}</td>
                        <td>${cleanCorrect}</td>
                        <td style="text-align:center">${data.isCorrect ? '✔' : '✘'}</td>
                    </tr>
                `;
            });

            const printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <html>
                <head>
                    <title>Hasil ${section.title}</title>
                    <style>
                        body { font-family: Arial, sans-serif; font-size: 12px; color: #000; }
                        h2 { margin: 0 0 10px 0; }
                        .header-info { margin-bottom: 20px; line-height: 1.5; }
                        .header-info p { margin: 2px 0; }
                        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
                        th, td { border: 1px solid #000; padding: 6px; vertical-align: top; }
                        th { background-color: #f0f0f0; text-align: left; }
                        .sign { margin-top: 40px; text-align: right; }
                        @page { size: A4; margin: 15mm; }
                    </style>
                </head>
                <body>
                    <h2>MATH TUTORING by Deni</h2>
                    <div class="header-info">
                        <p><strong>Name:</strong> _____________________________</p>
                        <p><strong>Date:</strong> ${dateStr}</p>
                        <p><strong>Topic:</strong> ${topic}</p>
                        <p><strong>Assignment Group:</strong> ${section.groupName}</p>
                        <p><strong>Score:</strong> <span style="font-weight:bold; color:blue;">${score} / 10</span></p>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th style="width:5%">No.</th>
                                <th style="width:45%">Question</th>
                                <th style="width:15%">Student Answer</th>
                                <th style="width:15%">Correct Answer</th>
                                <th style="width:10%">Note</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tableRows}
                        </tbody>
                    </table>
                    <div class="sign">
                        <p>Checked by,</p>
                        <br>
                        <p><strong>Deni</strong></p>
                    </div>
                </body>
                </html>
            `);
            printWindow.document.close();
            setTimeout(() => {
                printWindow.print();
            }, 500);
        }

        // ==========================================
        // INITIALIZE
        // ==========================================
        document.addEventListener("DOMContentLoaded", function() {
            renderNav();
            renderContent();
        });
    </script>
</body>
</html>
