        // --- UTILITY FUNCTIONS ---
        function shuffleArray(array) {
            let curId = array.length;
            while (0 !== curId) {
                let randId = Math.floor(Math.random() * curId);
                curId -= 1;
                let tmp = array[curId];
                array[curId] = array[randId];
                array[randId] = tmp;
            }
            return array;
        }

        function applyKaTeX(el) {
            if(typeof renderMathInElement === 'function') {
                renderMathInElement(el, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '\\(', right: '\\)', display: false},
                        {left: '\\[', right: '\\]', display: true}
                    ]
                });
            }
        }

        function t(obj) {
            if(!obj) return '';
            const mainText = obj.text_id || obj.q_id || obj.explain_id || obj.id || '';
            const transText = obj.text_en || obj.q_en || obj.explain_en || obj.en || '';
            return `<div>${mainText}</div>${transText ? `<div class="translation">${transText}</div>` : ''}`;
        }

        function getSVG(key) {
            const svgs = {
                brain: `<svg class="w-16 h-16 mx-auto my-4 text-blue-500 bounce-in" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.343 2.657l-.707.707M21 12h-1M17.343 17.343l-.707-.707M12 21v-1m-6.343-2.657l.707-.707M3 12h1m4.343-4.343l.707.707M12 12a4 4 0 100 8 4 4 0 000-8z"></path></svg>`,
                jump: `<svg class="w-16 h-16 mx-auto my-4 text-green-500 bounce-in" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v5m2-3H4m12-7v5m2-3h-4m-4-4l3 3m0-6l-3 3m12 0l-3 3m0-6l3 3M9 9l3 3m0-6l-3 3"></path></svg>`,
                factorVsMultiple: `<div class="flex justify-around my-4 text-center bounce-in"><div class="text-red-500"><i data-lucide="arrow-down-circle" class="w-10 h-10 mx-auto"></i><br>Faktor<br>(Kecil)</div><div class="text-green-500"><i data-lucide="arrow-up-circle" class="w-10 h-10 mx-auto"></i><br>Kelipatan<br>(Besar)</div></div>`
            };
            return svgs[key] || '';
        }

        // --- CORE RENDERING ---
        function renderPath() {
            const sidebar = document.getElementById('sidebar');
            sidebar.innerHTML = '';
            nodes.forEach((n, idx) => {
                if (idx > 0) {
                    const line = document.createElement('div');
                    line.className = 'path-line h-12';
                    sidebar.appendChild(line);
                }
                const nodeDiv = document.createElement('div');
                nodeDiv.className = `node ${n.status}`;
                nodeDiv.innerHTML = idx + 1;
                nodeDiv.onclick = () => {
                    if(n.status !== 'locked') goToNode(idx);
                };
                sidebar.appendChild(nodeDiv);
            });
            lucide.createIcons();
        }

        function renderContent() {
            const main = document.getElementById('main-content');
            const node = nodes[currentIndex];
            const data = contentData[node.id];
            
            // DIHAPUS class fade-in agar tidak ada efek transisi saat pilih jawaban
            let html = `<div class="max-w-3xl mx-auto">`;
            html += `<h2 class="text-2xl font-bold mb-6 text-blue-800 flex items-center gap-3"><i data-lucide="book-open" class="w-6 h-6"></i> ${node.title}</h2>`;
            
            if(data) {
                if(node.type === 'section') {
                    let exIdx = 0;
                    const m0 = data.theory[0].math ? `<div class="mt-2 text-center overflow-x-auto">$$ ${data.theory[0].math} $$</div>` : '';
                    html += `<div class="theory-card p-4 rounded shadow-sm mb-4">${t(data.theory[0])} ${getSVG(data.theory[0].svg)} ${m0}</div>`;
                    html += renderExercises(data.exercises.slice(0, 3), node.id, exIdx); exIdx += 3;
                    
                    const m1 = data.theory[1].math ? `<div class="mt-2 text-center overflow-x-auto">$$ ${data.theory[1].math} $$</div>` : '';
                    html += `<div class="theory-card p-4 rounded shadow-sm mb-4 mt-8">${t(data.theory[1])} ${getSVG(data.theory[1].svg)} ${m1}</div>`;
                    html += renderExercises(data.exercises.slice(3, 6), node.id, exIdx); exIdx += 3;
                    
                    const m2 = data.theory[2].math ? `<div class="mt-2 text-center overflow-x-auto">$$ ${data.theory[2].math} $$</div>` : '';
                    html += `<div class="theory-card p-4 rounded shadow-sm mb-4 mt-8">${t(data.theory[2])} ${getSVG(data.theory[2].svg)} ${m2}</div>`;
                    html += renderExercises(data.exercises.slice(6, 10), node.id, exIdx);

                } else if(node.type === 'assignment') {
                    html += `<p class="text-sm mb-4 text-gray-500">Selesaikan 10 soal berikut untuk mendapatkan skor!</p>`;
                    html += renderExercises(data.exercises, node.id, 0);
                    html += `<button onclick="printResult('${node.id}')" class="mt-6 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 flex items-center gap-2"><i data-lucide="printer" class="w-4 h-4"></i> Print Result</button>`;
                } else {
                    data.theory.forEach(th => {
                        html += `<div class="theory-card p-4 rounded shadow-sm mb-4">${t(th)} ${getSVG(th.svg)}`;
                        if(th.list) {
                            html += `<ul class="list-disc pl-5 mt-2 space-y-1">`;
                            th.list.forEach(l => html += `<li>${t(l)}</li>`);
                            html += `</ul>`;
                        }
                        if(th.isLink) {
                            html += `<a href="https://learn.algonova.id/login" target="_blank" class="mt-3 inline-block bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600 font-bold transition transform hover:scale-105"><i data-lucide="external-link" class="w-4 h-4 inline mr-1"></i> learn.algonova.id</a>`;
                        }
                        html += `</div>`;
                    });
                }
            }

            html += `</div>`;
            main.innerHTML = html;
            
            applyKaTeX(main);
            lucide.createIcons();

            if(data && data.exercises.length === 0 && node.status !== 'completed') {
                node.status = 'completed';
                let nextIdx = nodes.findIndex(n => n.id === node.id) + 1;
                if(nextIdx < nodes.length && nodes[nextIdx].status === 'locked') {
                    nodes[nextIdx].status = 'active';
                }
                saveState();
                renderPath();
                updateNavButtons();
            } else {
                updateNavButtons();
            }
        }

        function renderExercises(exercises, nodeId, startIndex) {
            if(!exercises || exercises.length === 0) return '';
            let html = `<div class="space-y-4 mt-4">`;
            
            exercises.forEach((ex, i) => {
                const gIdx = startIndex + i;
                const stateId = `${nodeId}_ex_${gIdx}`;
                const ans = appState[stateId];
                
                if(!appState[`${stateId}_opts`]) {
                    appState[`${stateId}_opts`] = shuffleArray([...ex.options]);
                    saveState();
                }
                const opts = appState[`${stateId}_opts`];

                html += `<div id="ex-${stateId}" class="exercise-card p-4 rounded shadow-sm ${ans ? (ans.correct ? 'correct-bg' : 'wrong-bg') : ''}">`;
                html += `<p class="font-semibold mb-2">${i+1}. ${t(ex)}</p>`;
                
                if(ex.type === 'multiple') {
                    html += `<div class="space-y-2 ml-4">`;
                    opts.forEach(opt => {
                        const isChecked = ans && ans.val === opt.val;
                        html += `<label class="flex items-center gap-2 cursor-pointer ${ans ? 'pointer-events-none opacity-70' : ''}">
                            <input type="radio" name="${stateId}" value="${opt.val}" ${isChecked ? 'checked' : ''} onchange="checkAnswer('${stateId}', '${opt.val}', ${opt.correct}, '${nodeId}')" class="w-4 h-4">
                            <span>${opt.val}</span>
                        </label>`;
                    });
                    html += `</div>`;
                } else if(ex.type === 'checkbox') {
                    html += `<div class="space-y-2 ml-4 flex flex-wrap gap-2">`;
                    opts.forEach(opt => {
                        const isChecked = ans && ans.vals && ans.vals.includes(opt.val);
                        html += `<label class="flex items-center gap-2 border p-2 rounded cursor-pointer ${ans ? 'pointer-events-none opacity-70' : ''} ${isChecked ? 'bg-blue-100' : ''}">
                            <input type="checkbox" name="${stateId}" value="${opt.val}" ${isChecked ? 'checked' : ''} class="w-4 h-4 cb-${stateId}">
                            <span>${opt.val}</span>
                        </label>`;
                    });
                    html += `</div>`;
                    if(!ans) html += `<button onclick="checkCheckbox('${stateId}', '${nodeId}')" class="mt-2 bg-blue-500 text-white px-3 py-1 rounded text-sm hover:bg-blue-600">Submit</button>`;
                }

                // Collapse & Reset Button
                if(ans) {
                    html += `<div class="mt-3 border-t pt-3 text-sm flex justify-between items-start gap-2">
                        <div class="flex-1">
                            <button onclick="toggleCollapse('col-${stateId}')" class="text-blue-600 font-bold flex items-center gap-1 mb-2"><i data-lucide="help-circle" class="w-4 h-4"></i> Penjelasan</button>
                            <div id="col-${stateId}" class="hidden mt-2 bg-gray-50 p-2 rounded border">
                                ${ans.correct ? '<p class="text-green-600 font-bold">Benar! ✓</p>' : '<p class="text-red-600 font-bold">Salah ✗</p>'}
                                ${t({explain_id: ex.explain_id, explain_en: ex.explain_en})} 
                            </div>
                        </div>
                        <button onclick="resetExercise('${stateId}', '${nodeId}')" class="text-orange-500 hover:text-orange-700 font-bold flex items-center gap-1 text-xs border border-orange-500 px-2 py-1 rounded flex-shrink-0 mt-1">
                            <i data-lucide="rotate-ccw" class="w-3 h-3"></i> Ulangi
                        </button>
                    </div>`;
                }

                html += `</div>`;
            });

            html += `</div>`;
            return html;
        }

        // --- INTERACTION LOGIC ---
        function checkAnswer(stateId, val, isCorrect, nodeId) {
            if(appState[stateId]) return;
            appState[stateId] = { val, correct: isCorrect };
            saveState();
            updateNodeCompletion(nodeId);
            renderContent();
        }

        function checkCheckbox(stateId, nodeId) {
            if(appState[stateId]) return;
            const checks = document.querySelectorAll(`.cb-${stateId}:checked`);
            let vals = Array.from(checks).map(c => c.value);
            
            const node = nodes.find(n => n.id === nodeId);
            const data = contentData[node.id];
            // Find correct answers
            const exIdx = parseInt(stateId.split('_ex_')[1]);
            const ex = data.exercises[exIdx];
            const correctVals = ex.options.filter(o => o.correct).map(o => o.val).sort().join(',');
            const isCorrect = vals.sort().join(',') === correctVals;

            appState[stateId] = { vals, correct: isCorrect };
            saveState();
            updateNodeCompletion(nodeId);
            renderContent();
        }

        function toggleCollapse(id) {
            const el = document.getElementById(id);
            if(el) el.classList.toggle('hidden');
        }

        function resetExercise(stateId, nodeId) {
            // Hapus jawaban dan opsi random dari memory
            delete appState[stateId];
            delete appState[`${stateId}_opts`];
            saveState();
            // Update ikon sidebar (jika semula hijau, jadi oren lagi)
            updateNodeCompletion(nodeId); 
            // Render ulang konten soal
            renderContent();
        }

        function updateNodeCompletion(nodeId) {
            const node = nodes.find(n => n.id === nodeId);
            const data = contentData[node.id];
            if(!data) return;

            let totalEx = data.exercises.length;
            let answeredEx = 0;
            for(let i=0; i<totalEx; i++) {
                if(appState[`${nodeId}_ex_${i}`]) answeredEx++;
            }

            // Jika semua exercise dijawab, node jadi hijau (completed)
            if(answeredEx === totalEx && totalEx > 0 && node.status !== 'completed') {
                node.status = 'completed';
                saveState();
                renderPath();
            } 
            // Jika ada soal yang di-reset, node kembali jadi oren (active)
            else if (answeredEx < totalEx && node.status === 'completed') {
                node.status = 'active';
                saveState();
                renderPath();
            }
        }

        // --- NAVIGATION ---

        function navigate(dir) {
            let next = currentIndex + dir;
            // Bisa navigasi selama tidak di luar batas array
            if(next >= 0 && next < nodes.length) {
                currentIndex = next;
                saveState();
                renderPath();
                renderContent();
            }
        }

        function updateNavButtons() {
            document.getElementById('btn-prev').disabled = currentIndex === 0;
            // Tombol next hanya disabled jika di node paling akhir
            document.getElementById('btn-next').disabled = currentIndex === nodes.length - 1;
            document.getElementById('progress-text').innerText = `Node ${currentIndex + 1} / ${nodes.length}`;
        }

        function goToNode(idx) {
            currentIndex = idx;
            saveState();
            renderPath();
            renderContent();
        }

        // --- STATE PERSISTENCE ---
        function saveState() {
            localStorage.setItem('mathTutorState', JSON.stringify(appState));
            localStorage.setItem('mathTutorNodes', JSON.stringify(nodes));
            localStorage.setItem('mathTutorCurrent', currentIndex);
        }

        function loadState() {
            const s = localStorage.getItem('mathTutorState');
            if(s) appState = JSON.parse(s);
            const n = localStorage.getItem('mathTutorNodes');
            if(n) {
                const savedNodes = JSON.parse(n);
                // Merge to keep new structure if code updates
                nodes.forEach((nd, idx) => {
                    if(savedNodes[idx]) nd.status = savedNodes[idx].status;
                });
            }
            const c = localStorage.getItem('mathTutorCurrent');
            if(c) currentIndex = parseInt(c);
        }

        function resetProgress() {
            if(confirm("Apakah kamu yakin ingin mereset semua progres?")) {
                localStorage.removeItem('mathTutorState');
                localStorage.removeItem('mathTutorNodes');
                localStorage.removeItem('mathTutorCurrent');
                location.reload();
            }
        }

        // --- PRINT LOGIC (Stub for Chat 3) ---
        function printResult(nodeId) {
            const node = nodes.find(n => n.id === nodeId);
            const data = contentData[node.id];
            
            let score = 0;
            let tableRows = '';
            const now = new Date();
            const dateStr = now.toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' });

            data.exercises.forEach((ex, i) => {
                const stateId = `${nodeId}_ex_${i}`;
                const ans = appState[stateId];
                let studentAnsText = "-";
                let correctAnsText = ex.options.filter(o => o.correct).map(o => o.val).join(', ');
                let noteIcon = "➖";

                if(ans) {
                    if(ans.vals) studentAnsText = ans.vals.join(', ');
                    else studentAnsText = ans.val;
                    
                    if(ans.correct) {
                        score++;
                        noteIcon = "✅";
                    } else {
                        noteIcon = "❌";
                    }
                }

                tableRows += `<tr>
                    <td style="border: 1px solid #000; padding: 4px; text-align: center;">${i+1}</td>
                    <td style="border: 1px solid #000; padding: 4px; font-size: 9pt;">${ex.q_id}</td>
                    <td style="border: 1px solid #000; padding: 4px; text-align: center;">${studentAnsText}</td>
                    <td style="border: 1px solid #000; padding: 4px; text-align: center;">${correctAnsText}</td>
                    <td style="border: 1px solid #000; padding: 4px; text-align: center;">${noteIcon}</td>
                </tr>`;
            });

            const htmlContent = `
                <h1 style="text-align: center; margin-bottom: 10px;">MATH TUTORING by Deni</h1>
                <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                    <div>
                        <p><strong>Name:</strong> ___________________________</p>
                        <p><strong>Topic:</strong> Konsep Kelipatan (Melompat di Platform)</p>
                    </div>
                    <div>
                        <p><strong>Date:</strong> ${dateStr}</p>
                        <p><strong>Assignment Group:</strong> ${node.title}</p>
                    </div>
                </div>
                
                <h2 style="text-align: center; margin-top: 15px; margin-bottom: 10px; border-top: 2px solid #000; border-bottom: 2px solid #000; padding: 5px 0;">
                    Score: ${score} / ${data.exercises.length}
                </h2>

                <table style="width: 100%; border-collapse: collapse; font-family: Arial, sans-serif; font-size: 11pt;">
                    <thead>
                        <tr>
                            <th style="border: 1px solid #000; padding: 4px; width: 5%;">No.</th>
                            <th style="border: 1px solid #000; padding: 4px; width: 45%;">Question</th>
                            <th style="border: 1px solid #000; padding: 4px; width: 15%;">Student Answer</th>
                            <th style="border: 1px solid #000; padding: 4px; width: 15%;">Correct Answer</th>
                            <th style="border: 1px solid #000; padding: 4px; width: 10%;">Note</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${tableRows}
                    </tbody>
                </table>

                <div style="margin-top: 40px; text-align: right;">
                    <p>Checked by,</p>
                    <br><br>
                    <p><strong>Deni</strong></p>
                </div>
            `;

            // Inject ke div print-area yang sudah ada
            const printArea = document.getElementById('print-area');
            printArea.innerHTML = htmlContent;
            printArea.classList.remove('hidden');

            // Trigger print dialog
            setTimeout(() => {
                window.print();
                // Setelah dialog print ditutup, sembunyikan lagi div-nya
                setTimeout(() => {
                    printArea.classList.add('hidden');
                    printArea.innerHTML = '';
                }, 500);
            }, 300);
        }

        // --- INIT ---
        window.onload = () => {
            loadState();
            // Force unlock all nodes so user can navigate freely
            nodes.forEach(n => {
                if(n.status === 'locked') n.status = 'active';
            });
            if(nodes[0].status === 'locked') nodes[0].status = 'active';
            renderPath();
            renderContent();
        };
    </script>
</body>
</html>
