<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATH TUTORING - Pecahan Senilai (Kloning Item)</title>
    
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #58cc02; /* Duolingo Green */
            --primary-dark: #46a302;
            --wrong: #ff4b4b;
            --wrong-dark: #ea2b2b;
            --bg: #131f24;
            --nav-bg: #1b2b32;
            --card-bg: #ffffff;
            --text-dark: #3c3c3c;
            --text-light: #ffffff;
            --border-color: #e5e5e5;
            --blue: #1cb0f6;
            --purple: #ce82ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }

        body { background-color: var(--bg); color: var(--text-light); display: flex; height: 100vh; overflow: hidden; }

        /* Navbar Left */
        #sidebar { width: 280px; background-color: var(--nav-bg); padding: 20px 0; display: flex; flex-direction: column; border-right: 1px solid #2b3d45; z-index: 10; overflow-y: auto; }
        .nav-header { padding: 0 20px 20px; border-bottom: 1px solid #2b3d45; margin-bottom: 10px; }
        .nav-header h2 { color: var(--blue); font-size: 1.1rem; margin-bottom: 5px; }
        .nav-header p { font-size: 0.8rem; color: #8b9ea8; }
        
        .nav-list { flex: 1; padding: 10px 0; overflow-y: auto; }
        .nav-item { padding: 12px 20px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: background 0.2s; border-left: 4px solid transparent; font-size: 0.9rem; }
        .nav-item:hover { background: #243840; }
        .nav-item.active { background: #243840; border-left: 4px solid var(--blue); font-weight: 700; }
        .nav-item.completed { color: var(--primary); }
        .nav-item .check-icon { color: var(--primary); font-size: 1.2rem; }
        
        .nav-footer { padding: 20px; border-top: 1px solid #2b3d45; }
        .btn-reset { width: 100%; padding: 10px; background: var(--wrong); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 700; border-bottom: 3px solid var(--wrong-dark); transition: filter 0.2s; }
        .btn-reset:hover { filter: brightness(1.1); }

        /* Main Content */
        #main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        /* Progress Bar Top */
        #progress-bar-container { height: 10px; background: #243840; padding: 0; }
        #progress-bar { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s ease-out; }

        /* Step Container */
        #step-container { flex: 1; overflow-y: auto; padding: 30px 40px; display: flex; flex-direction: column; align-items: center; }
        
        .card { background: var(--card-bg); color: var(--text-dark); border-radius: 16px; padding: 30px; width: 100%; max-width: 700px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); position: relative; animation: slideIn 0.4s ease-out; }
        
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        @keyframes bounce { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        .card-type-theory { border-top: 5px solid var(--blue); }
        .card-type-exercise { border-top: 5px solid var(--purple); }
        
        .step-icon { font-size: 2rem; margin-bottom: 15px; }
        .theory-icon { color: var(--blue); }
        .exercise-icon { color: var(--purple); }

        .card h2 { font-size: 1.5rem; margin-bottom: 15px; }
        .card p { line-height: 1.6; margin-bottom: 15px; font-size: 1rem; }
        .card .katex-display { margin: 10px 0; }
        
        /* SVG Illustrations */
        .illustration-box { background: #f7f7f7; border-radius: 12px; padding: 20px; text-align: center; margin: 20px 0; border: 1px dashed var(--border-color); }
        svg { max-width: 100%; height: auto; }

        /* Exercises */
        .option-group { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .option-btn, .option-label { background: white; border: 2px solid var(--border-color); border-radius: 12px; padding: 12px 15px; cursor: pointer; transition: all 0.2s; font-size: 1rem; text-align: left; display: flex; align-items: center; }
        .option-btn:hover, .option-label:hover { border-color: var(--blue); background: #e5f5ff; }
        .option-btn.selected, .option-label.selected { border-color: var(--blue); background: #ddf4ff; color: #0080ff; font-weight: 700; }
        .option-btn.correct { border-color: var(--primary); background: #e5ffd4; color: var(--primary-dark); }
        .option-btn.wrong { border-color: var(--wrong); background: #ffe5e5; color: var(--wrong-dark); animation: shake 0.3s; }
        
        .input-answer { width: 100%; padding: 12px; border: 2px solid var(--border-color); border-radius: 12px; font-size: 1.2rem; text-align: center; outline: none; }
        .input-answer:focus { border-color: var(--blue); }

        /* Feedback Collapse */
        .feedback-collapse { margin-top: 20px; background: #f0f0f0; border-radius: 12px; overflow: hidden; max-height: 0; transition: max-height 0.3s ease-out, padding 0.3s; padding: 0 15px; }
        .feedback-collapse.show { max-height: 300px; padding: 15px; border-left: 4px solid var(--primary); }
        .feedback-collapse.wrong-feedback.show { border-left-color: var(--wrong); }
        .feedback-title { font-weight: 700; margin-bottom: 5px; }

        /* Bottom Navigation */
        #nav-bottom { background: var(--nav-bg); padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #2b3d45; }
        .btn-nav { padding: 12px 24px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; font-size: 1rem; transition: filter 0.2s; }
        .btn-prev { background: #3a4f57; color: white; border-bottom: 3px solid #2b3d32; }
        .btn-next { background: var(--primary); color: white; border-bottom: 3px solid var(--primary-dark); }
        .btn-check { background: var(--blue); color: white; border-bottom: 3px solid #0080cc; }
        .btn-nav:disabled { 
			background: #3a4f57; 
			color: #5a6f77; 
			border-bottom: 3px solid #2b3d32; 
			cursor: not-allowed; 
			opacity: 0.5; /* Tambahkan ini agar lebih redup */
			filter: grayscale(100%); /* Buat warna hilang sepenuhnya */
		}
        .btn-nav:hover:not(:disabled) { filter: brightness(1.1); }

        /* Print Format CSS */
        @media print {
            body { background: white; color: black; display: block; height: auto; overflow: visible; }
            #sidebar, #nav-bottom, #progress-bar-container, .btn-nav, .illustration-box, .feedback-collapse, .step-icon { display: none !important; }
            #main-content { flex: none; overflow: visible; }
            #step-container { padding: 0; overflow: visible; }
            .card { box-shadow: none; border: 1px solid black; animation: none; page-break-inside: avoid; margin-bottom: 10px; width: 100%; }
            .print-table { width: 100%; border-collapse: collapse; font-size: 10pt; }
            .print-table th, .print-table td { border: 1px solid black; padding: 4px; text-align: left; }
            .print-header { text-align: center; margin-bottom: 10px; }
        }
    </style>
</head>
<body>

    <!-- Sidebar Navigation -->
    <nav id="sidebar">
        <div class="nav-header">
            <h2><i class="fas fa-graduation-cap"></i> MATH TUTORING</h2>
            <p>by Deni</p>
        </div>
        <div class="nav-list" id="nav-list">
            <!-- JS will populate items here -->
        </div>
        <div class="nav-footer">
            <button class="btn-reset" onclick="resetProgress()"><i class="fas fa-redo"></i> Reset Semua Progres</button>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main id="main-content">
        <div id="progress-bar-container">
            <div id="progress-bar"></div>
        </div>
        
        <div id="step-container">
            <!-- Dynamic Card Content Rendered Here by JS -->
        </div>

        <div id="nav-bottom">
            <button class="btn-nav btn-prev" id="btn-prev" onclick="prevStep()"><i class="fas fa-arrow-left"></i> Kembali</button>
            <button class="btn-nav btn-check" id="btn-check" onclick="checkAnswer()" style="display:none;">Cek Jawaban</button>
            <button class="btn-nav btn-next" id="btn-next" onclick="nextStep()">Lanjut <i class="fas fa-arrow-right"></i></button>
        </div>
    </main>

    <!-- KaTeX JS -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true},{left: '$', right: '$', display: false}]});"></script>

    <!-- App Logic & Data will be placed here in subsequent parts -->
<script>
    // ==========================================
    // STATE & DATA MANAGEMENT
    // ==========================================
    let appData = []; // Akan diisi dari Part 3, 4, 5
    let currentSectionIdx = 0;
    let currentStepIdx = 0;
    let userProgress = JSON.parse(localStorage.getItem('mathTutorProgress')) || {};
    let selectedAnswer = null;

    // ==========================================
    // UTILITY FUNCTIONS

    // Acak array (untuk pilihan ganda)
    function shuffleArray(array) {
        let curId = array.length;
        while (0 !== curId) {
            let randId = Math.floor(Math.random() * curId);
            curId -= 1;
            let tmp = array[curId];
            array[curId] = array[randId];
            array[randId] = tmp;
        }
        return array;
    }

    // Save progress to local storage
    function saveProgress() {
        localStorage.setItem('mathTutorProgress', JSON.stringify(userProgress));
    }

    // Reset all progress
    function resetProgress() {
        if(confirm('Apakah kamu yakin ingin mereset semua progres belajar?')) {
            localStorage.removeItem('mathTutorProgress');
            userProgress = {};
            currentSectionIdx = 0;
            currentStepIdx = 0;
            selectedAnswer = null;
            renderApp();
        }
    }

    // ==========================================
    // NAVIGATION LOGIC
    // ==========================================
    function jumpToSection(secIdx) {
        currentSectionIdx = secIdx;
        currentStepIdx = 0;
        selectedAnswer = null;
        renderApp();
    }

    function nextStep() {
        const section = appData[currentSectionIdx];
        if (currentStepIdx < section.steps.length - 1) {
            currentStepIdx++;
        } else {
            // Move to next section if exists
            if (currentSectionIdx < appData.length - 1) {
                currentSectionIdx++;
                currentStepIdx = 0;
            } else {
                return; // End of app
            }
        }
        selectedAnswer = null;
        renderApp();
    }

    function prevStep() {
        if (currentStepIdx > 0) {
            currentStepIdx--;
        } else {
            // Move to previous section if exists
            if (currentSectionIdx > 0) {
                currentSectionIdx--;
                currentStepIdx = appData[currentSectionIdx].steps.length - 1;
            } else {
                return; // Start of app
            }
        }
        selectedAnswer = null;
        renderApp();
    }

    // ==========================================
    // RENDERING ENGINE
    // ==========================================
    function renderApp() {
        if(appData.length === 0) {
            document.getElementById('step-container').innerHTML = `<div class="card"><h2>Memuat data...</h2><p>Data pelajaran belum dimuat. Harap gabungkan semua bagian JavaScript.</p></div>`;
            return;
        }

        renderSidebar();
        renderStepCard();
        updateProgressBar();
        updateNavButtons();
        
        // Render KaTeX after HTML injection
        if (typeof renderMathInElement !== 'undefined') {
            renderMathInElement(document.getElementById('step-container'), {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false}
                ]
            });
        }
    }

    function renderSidebar() {
        const navList = document.getElementById('nav-list');
        navList.innerHTML = '';
        
        appData.forEach((section, secIdx) => {
            const item = document.createElement('div');
            item.className = 'nav-item';
            if (secIdx === currentSectionIdx) item.classList.add('active');
            
            // Check if section is completed
            const isCompleted = section.steps.every(step => userProgress[step.id] === true);
            if (isCompleted) item.classList.add('completed');

            item.innerHTML = `
                <span><i class="${section.icon}" style="margin-right: 8px;"></i> ${section.title}</span>
                ${isCompleted ? '<i class="fas fa-check-circle check-icon"></i>' : ''}
            `;
            item.onclick = () => jumpToSection(secIdx);
            navList.appendChild(item);
        });
    }

    function renderStepCard() {
        const container = document.getElementById('step-container');
        const step = appData[currentSectionIdx].steps[currentStepIdx];
        const isAnswered = userProgress[step.id] !== undefined;
        
        let html = `<div class="card card-type-${step.type}">`;
        
        if(step.type === 'theory') {
            html += `
                <div class="step-icon theory-icon"><i class="fas fa-book-open"></i></div>
                <h2>${step.title}</h2>
                <div class="theory-content">${step.content}</div>
            `;
            if(step.illustration) html += `<div class="illustration-box">${step.illustration}</div>`;
        } 
        else if (step.type === 'exercise') {
            html += `
                <div class="step-icon exercise-icon"><i class="fas fa-flask"></i></div>
                <h2>${step.title}</h2>
                <p><strong>Soal:</strong> ${step.question}</p>
            `;

            // Render Input based on answerType
            if (step.answerType === 'options') {
                html += `<div class="option-group">`;
                // We use a stored shuffled order if exists, else shuffle now
                if(!step.shuffledOptions) step.shuffledOptions = shuffleArray([...step.options]);
                
                step.shuffledOptions.forEach((opt, idx) => {
                    let isSelected = selectedAnswer === opt;
					if(isAnswered && userProgress[step.id + '_attempt'] === opt) {
						isSelected = true; // Paksa opsi yang salah tetap menyala jika di-review
					}
                    let stateClass = isSelected ? 'selected' : '';
                    
                    if(isAnswered) {
                        const isCorrect = opt === step.answer;
                        const wasSelectedAndWrong = isSelected && !isCorrect;
                        if(isCorrect) stateClass = 'correct';
                        if(wasSelectedAndWrong) stateClass = 'wrong';
                    }

                    html += `<button class="option-btn ${stateClass}" onclick="selectOption(this, '${opt.replace(/'/g, "\\'")}')" ${isAnswered ? 'disabled' : ''}>${opt}</button>`;
                });
                html += `</div>`;
            } 
            else if (step.answerType === 'text') {
                const val = isAnswered ? (userProgress[step.id] === true ? step.answer : selectedAnswer || '') : (selectedAnswer || '');
                html += `<input type="text" class="input-answer" id="text-answer" value="${val}" placeholder="Ketik jawaban..." oninput="selectedAnswer = this.value" ${isAnswered ? 'disabled' : ''}>`;
            }

            // Feedback Collapse
            if(isAnswered) {
                const isCorrect = userProgress[step.id] === true;
                html += `
                    <div class="feedback-collapse show ${isCorrect ? '' : 'wrong-feedback'}">
                        <div class="feedback-title" style="color: ${isCorrect ? 'var(--primary-dark)' : 'var(--wrong-dark)'}">
                            ${isCorrect ? '<i class="fas fa-check-circle"></i> Benar Sekali!' : '<i class="fas fa-times-circle"></i> Belum Tepat'}
                        </div>
                        <div>${step.explanation}</div>
                    </div>
                `;
            }
        }
        
        html += `</div>`;
        container.innerHTML = html;
    }

    function updateProgressBar() {
        let totalSteps = 0;
        let completedSteps = 0;
        appData.forEach(sec => {
            totalSteps += sec.steps.length;
            sec.steps.forEach(step => {
                if(userProgress[step.id] === true) completedSteps++;
            });
        });
        const percent = totalSteps === 0 ? 0 : (completedSteps / totalSteps) * 100;
        document.getElementById('progress-bar').style.width = `${percent}%`;
    }

    function updateNavButtons() {
        const step = appData[currentSectionIdx].steps[currentStepIdx];
        const isAnswered = userProgress[step.id] !== undefined;
        
        document.getElementById('btn-prev').disabled = (currentSectionIdx === 0 && currentStepIdx === 0);
        
        const isLastStep = (currentSectionIdx === appData.length - 1 && currentStepIdx === appData[currentSectionIdx].steps.length - 1);
        document.getElementById('btn-next').disabled = !isAnswered; // Must answer before next (or view theory)
        
        if(step.type === 'theory') {
            document.getElementById('btn-next').disabled = false; // Can skip theory
        }

        document.getElementById('btn-next').style.display = isLastStep ? 'none' : 'inline-block';
        document.getElementById('btn-check').style.display = (step.type === 'exercise' && !isAnswered) ? 'inline-block' : 'none';
    }

    // ==========================================
    // EXERCISE INTERACTION LOGIC
    // ==========================================
    function selectOption(btn, optValue) {
        if(userProgress[appData[currentSectionIdx].steps[currentStepIdx].id]) return; // Already answered
        selectedAnswer = optValue;
        
        // Update UI selection
        const siblings = btn.parentElement.querySelectorAll('.option-btn');
        siblings.forEach(s => s.classList.remove('selected'));
        btn.classList.add('selected');
    }

    function checkAnswer() {
        const step = appData[currentSectionIdx].steps[currentStepIdx];
        if(selectedAnswer === null && step.answerType === 'options') return alert('Pilih satu jawaban dulu!');
        if(selectedAnswer === '' && step.answerType === 'text') return alert('Ketik jawaban dulu!');

        let isCorrect = false;
        if(step.answerType === 'options') {
            isCorrect = selectedAnswer === step.answer;
        } else if(step.answerType === 'text') {
            // Allow for flexible math answers (e.g. "2/3" or "2/3 ")
            isCorrect = selectedAnswer.trim().replace(/\s/g, '') === step.answer.trim().replace(/\s/g, '');
        }

        userProgress[step.id] = isCorrect;
        if(!isCorrect) userProgress[step.id + '_attempt'] = selectedAnswer; // save wrong attempt if needed
        saveProgress();
        
        // Animation on card
        const card = document.querySelector('.card');
        card.style.animation = 'none';
        card.offsetHeight; // trigger reflow
        card.style.animation = isCorrect ? 'bounce 0.4s' : 'shake 0.4s';

        renderStepCard();
        updateNavButtons();
        updateProgressBar();
        renderSidebar(); // Update checkmarks
    }

    // ==========================================
    // DATA CONTENT: PART 3 (Sections 1-4)
    // ==========================================
    
    // SECTION: HOME
    appData.push({
        id: "sec-home",
        title: "Home",
        icon: "fas fa-home",
        steps: [
            {
                id: "home-1",
                type: "theory",
                title: "MATH TUTORING by Deni",
                content: `
                    <p><strong>Topic:</strong> Pecahan Senilai (Kloning Item)</p>
                    <p><strong>Goal:</strong> Mengejar kesenjangan (Closing the Gap)</p>
                    <hr style="margin: 15px 0; border-color: #eee;">
                    <p><i class="fas fa-comments" style="color:var(--blue)"></i> <strong>Aturan Kelas:</strong></p>
                    <ol>
                        <li>Berbicara secara bergantian.</li>
                        <li>Meminta izin jika ingin meninggalkan kelas.</li>
                        <li>Menyalakan kamera dan microphone jika diperlukan.</li>
                    </ol>
                `,
                illustration: `
                    <svg viewBox="0 0 100 50" width="120">
                        <circle cx="25" cy="25" r="20" fill="#58cc02" opacity="0.8"/>
                        <circle cx="75" cy="25" r="20" fill="#1cb0f6" opacity="0.8"/>
                        <path d="M25,25 L75,25" stroke="white" stroke-width="4" stroke-linecap="round"/>
                        <path d="M65,15 L75,25 L65,35" fill="white"/>
                    </svg>
                `
            }
        ]
    });

    // SECTION: SPIRAL REVIEW WARM-UP
    appData.push({
        id: "sec-spiral",
        title: "Spiral Review (00:00-00:10)",
        icon: "fas fa-fire",
        steps: [
            // Theory 1: Kelipatan
            {
                id: "spiral-t1", type: "theory",
                title: "Pemanasan: Kelipatan",
                content: `<p>Sebelum masuk ke misi utama 'Kloning Item', kita perlu memanaskan mesin pencari faktor dan kelipatan. Ingat petualangan kita sebelumnya?</p><p><strong>Kelipatan</strong> adalah hasil perkalian suatu bilangan dengan bilangan bulat (1, 2, 3, ...). Contoh: Kelipatan 3 adalah 3, 6, 9, 12, ...</p>`,
                illustration: `<svg viewBox="0 0 100 40" width="150"><rect x="5" y="15" width="15" height="15" rx="3" fill="#ce82ff"/><rect x="25" y="15" width="15" height="15" rx="3" fill="#ce82ff"/><rect x="45" y="15" width="15" height="15" rx="3" fill="#ce82ff"/><path d="M12,22 L32,22 M52,22 L65,15 M52,22 L65,29" stroke="white" stroke-width="2" fill="none"/><text x="10" y="28" font-size="8" fill="white" font-weight="bold">3</text><text x="30" y="28" font-size="8" fill="white" font-weight="bold">6</text><text x="48" y="28" font-size="8" fill="white" font-weight="bold">9</text></svg>`
            },
            // Ex 1-3: Kelipatan
            { id: "spiral-e1", type: "exercise", title: "Tantangan Kelipatan 1", question: "Jika karaktermu melompat sejauh 8 unit, di titik mana saja ia akan mendarat dalam 3 lompatan pertama? (Pilih yang benar)", answerType: "options", options: ["8, 16, 24", "8, 15, 22", "1, 2, 3"], answer: "8, 16, 24", explanation: "Kelipatan 8 didapat dari $8 \\times 1 = 8$, $8 \\times 2 = 16$, $8 \\times 3 = 24$." },
            { id: "spiral-e2", type: "exercise", title: "Tantangan Kelipatan 2", question: "Sebutkan Kelipatan Persekutuan Terkecil (KPK) dari 4 dan 6.", answerType: "options", options: ["2", "12", "24"], answer: "12", explanation: "Kelipatan 4: 4, 8, <b>12</b>, 16... Kelipatan 6: 6, <b>12</b>, 18... Yang pertama sama adalah 12." },
            { id: "spiral-e3", type: "exercise", title: "Tantangan Kelipatan 3", question: "Kelipatan persekutuan dari 3 dan 5 yang kurang dari 20 adalah...", answerType: "options", options: ["15", "10", "30"], answer: "15", explanation: "Kelipatan 3: 3,6,9,12,<b>15</b>,18. Kelipatan 5: 5,10,<b>15</b>. Maka 15 adalah kelipatan persekutuan di bawah 20." },
            
            // Theory 2: Faktor
            {
                id: "spiral-t2", type: "theory",
                title: "Pemanasan: Faktor",
                content: `<p><strong>Faktor</strong> adalah bilangan yang dapat membagi habis bilangan lain. Contoh: Faktor dari 6 adalah 1, 2, 3, dan 6 (karena $6 \\div 2 = 3$ sisa 0).</p>`,
                illustration: `<svg viewBox="0 0 100 40" width="120"><rect x="20" y="5" width="60" height="30" rx="5" fill="#ff4b4b" stroke="#ea2b2b" stroke-width="2"/><circle cx="35" cy="20" r="8" fill="#ff9600"/><line x1="55" y1="10" x2="55" y2="30" stroke="white" stroke-width="2" stroke-dasharray="2"/><text x="67" y="24" font-size="10" fill="white" font-weight="bold">18</text></svg>`

    function printAssignment(secIdx) {
        const section = appData[secIdx];
        const exerciseSteps = section.steps.filter(s => s.type === 'exercise');
        
        let score = 0;
        exerciseSteps.forEach(step => {
            if(userProgress[step.id] === true) score++;
        });

        let tableRows = '';
        exerciseSteps.forEach((step, idx) => {
            const isCorrect = userProgress[step.id] === true;
            const userAns = isCorrect ? step.answer : (userProgress[step.id + '_attempt'] || '-');
            const noteIcon = isCorrect ? '✔️' : '❌';
            
            tableRows += `
                <tr>
                    <td style="text-align:center;">${idx + 1}</td>
                    <td>${step.question}</td>
                    <td style="text-align:center;">${userAns}</td>
                    <td style="text-align:center;">${step.answer}</td>
                    <td style="text-align:center;">${noteIcon}</td>
                </tr>
            `;
        });

        const printHTML = `

            <head>

                    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
                    th, td { border: 1px solid black; padding: 6px; font-size: 10pt; }
                    th { background-color: #f0f0f0; }

                    @page { size: A4; margin: 10mm; }
                </style>
            </head>
            <body>
                <div class="print-header">
                    <h2>MATH TUTORING by Deni</h2>
                </div>
                
                <div class="info-grid">
                    <div><strong>Name:</strong> ............................................</div>
                    <div><strong>Date:</strong> ............................................</div>
                    <div><strong>Topic:</strong> Pecahan Senilai (Kloning Item)</div>
                    <div><strong>Assignment Group:</strong> ${section.title}</div>
                </div>

                <h3>Score: ${score} / ${exerciseSteps.length}</h3>

                <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true},{left: '$', right: '$', display: false}]});"><\/script>
            </body>
            </html>
        `;

        const printWindow = window.open('', '_blank');
        printWindow.document.write(printHTML);
        printWindow.document.close();
        
        // Auto print after a slight delay to allow KaTeX to render
